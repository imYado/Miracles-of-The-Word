<style>
/* Layout: one quiet column under a night sky. The surah in Arabic first, then each verse opening into its layers. Single dark theme by design. */
:root {
  --night: #0D0A18;
  --raised: #151027;
  --line: #2A2342;
  --purple: #7B66B8;
  --purple-soft: #1D1733;
  --text: #F4F2FA;
  --muted: #A69EBE;
  --dim: #6E6788;
  --gold: #E8B84A;
  --gold-faint: rgba(232, 184, 74, .12);
  --t-consensus: #8FD5B5;
  --t-scholar: #B9AAF6;
  --t-reflection: #E8B84A;
  --verify: #F19A8C;
  --f-ar: "Amiri Quran", "Amiri", "Scheherazade New", "Traditional Arabic", serif;
  --f-display: "Cormorant Garamond", "Cormorant", Garamond, Georgia, serif;
  --f-body: "Spectral", Georgia, "Times New Roman", serif;
  --f-ui: "Red Hat Text", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--night); }
body { background: var(--night); color: var(--text); font-family: var(--f-body); font-weight: 300; font-size: 17px; line-height: 1.65; }
#sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
.page { position: relative; z-index: 1; max-width: 860px; margin: 0 auto;
  padding-block: 20px 140px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
:focus-visible { outline: 1px solid var(--gold); outline-offset: 3px; border-radius: 3px; }
::selection { background: var(--gold-faint); }

/* Header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 8px; }
.brand { font-family: var(--f-ui); font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); text-decoration: none; display: inline-flex; gap: 10px; align-items: center; }
.brand .star { color: var(--gold); font-size: 13px; letter-spacing: 0; }
.edit-toggle { font-family: var(--f-ui); font-size: 13px; letter-spacing: .08em; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 5px 14px; }
.edit-toggle:hover { color: var(--gold); border-color: var(--gold); }
.edit-toggle[aria-pressed="true"] { color: var(--night); background: var(--gold); border-color: var(--gold); }

/* Hero */
.hero { text-align: center; padding-block: 56px 28px; display: grid; gap: 8px; justify-items: center; }
.hero .name-ar { font-family: var(--f-ar); font-size: clamp(56px, 13vw, 92px); line-height: 1.3; color: var(--gold); margin: 0; font-weight: 400; }
.hero h1 { margin: 0; font-family: var(--f-display); font-weight: 500; font-size: clamp(28px, 5vw, 38px); letter-spacing: .02em; text-wrap: balance; }
.hero .meta { font-family: var(--f-ui); font-size: 12.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--dim); }
.hero .tagline { font-family: var(--f-display); font-style: italic; font-size: 22px; color: var(--muted); margin: 6px 0 0; max-width: 34ch; text-wrap: balance; }

/* Recitation */
.recite { padding-block: 28px 12px; display: grid; gap: 14px; }
.mushaf { font-family: var(--f-ar); direction: rtl; text-align: center; font-size: clamp(30px, 6.4vw, 46px); line-height: 2.25; margin: 0; }
.hint { text-align: center; font-family: var(--f-ui); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); margin: 0; }
.w { cursor: pointer; border-radius: 6px; padding: 0 .06em; transition: color .15s; display: inline-block; min-width: .6em; line-height: 1.6; }
.w:hover, .w:focus-visible, .w.on { color: var(--gold); outline: none; }
.w:empty::before { content: "…"; color: var(--dim); }
.end { color: var(--gold); font-size: .62em; padding-inline: .25em; opacity: .85; white-space: nowrap; }

/* Divider */
.divider { display: flex; align-items: center; gap: 16px; color: var(--gold); font-size: 12px; margin-block: 56px 40px; }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }

/* Verse */
.verse { display: grid; gap: 34px; scroll-margin-top: 20px; }
.v-label { font-family: var(--f-ui); font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); text-align: center; }
.ayah { font-family: var(--f-ar); direction: rtl; text-align: center; font-size: clamp(34px, 7vw, 52px); line-height: 2; margin: -18px 0 0; }
.literal { text-align: center; display: grid; gap: 4px; }
.literal p { font-family: var(--f-display); font-size: 23px; margin: 0; color: var(--text); font-weight: 500; }
.literal .added { color: var(--dim); }
.label { font-family: var(--f-ui); font-size: 11.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--dim); }
.block { display: grid; gap: 20px; }
.block > h3 { margin: 0; font-family: var(--f-ui); font-weight: 500; font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 12px; }
.block > h3::after { content: ""; flex: 1; height: 1px; background: var(--line); }

.layer { display: grid; grid-template-columns: 2.2em minmax(0, 1fr); gap: 4px 14px; }
.layer + .layer { padding-top: 22px; border-top: 1px solid var(--line); }
.layer .n { font-family: var(--f-display); font-size: 26px; color: var(--gold); line-height: 1.1; font-variant-numeric: lining-nums; }
.layer .body { display: grid; gap: 12px; min-width: 0; }
.layer .reading { font-family: var(--f-ui); font-size: 12.5px; letter-spacing: .06em; color: var(--muted); }
.layer .tl { font-family: var(--f-display); font-size: clamp(24px, 4.2vw, 30px); line-height: 1.25; margin: 0; font-weight: 500; text-wrap: balance; }
.tafsir { display: grid; gap: 14px; padding-left: 14px; border-left: 1px solid var(--purple); }
.tafsir .label { color: var(--purple); }
.tq { display: grid; gap: 3px; }
.tq .who { font-family: var(--f-ui); font-size: 13px; letter-spacing: .04em; color: var(--t-scholar); }
.tq .who.consensus { color: var(--t-consensus); }
.tq .who.reflection { color: var(--t-reflection); }
.tq p { margin: 0; font-size: 16.5px; }

.notes { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 28px 32px; }
.note { display: grid; gap: 6px; align-content: start; min-width: 0; }
.note .topic { font-family: var(--f-ui); font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--dim); }
.note h4 { margin: 0; font-family: var(--f-display); font-weight: 600; font-size: 24px; color: var(--gold); line-height: 1.2; }
.note p { margin: 0; font-size: 16.5px; }

.claim { display: grid; gap: 4px; min-width: 0; }
.claim > p { margin: 0; }
.by { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; font-family: var(--f-ui); font-size: 12.5px; color: var(--dim); }
.tag { letter-spacing: .03em; }
.tag::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: currentColor; margin-right: 6px; vertical-align: 1px; }
.tag.consensus { color: var(--t-consensus); }
.tag.scholar { color: var(--t-scholar); }
.tag.reflection { color: var(--t-reflection); }
.tag.none { color: var(--verify); }
.verify { margin-left: 6px; color: var(--verify); border: 1px solid currentColor; border-radius: 99px; padding: 0 7px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; line-height: 1.6; }
.verify.off { color: var(--dim); opacity: .7; }

details.asbab { border-top: 1px solid var(--line); padding-top: 14px; }
details.asbab summary { cursor: pointer; font-family: var(--f-ui); font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); list-style: none; display: flex; gap: 10px; align-items: center; }
details.asbab summary::-webkit-details-marker { display: none; }
details.asbab summary::before { content: "+"; color: var(--gold); font-size: 16px; letter-spacing: 0; width: 1em; }
details.asbab[open] summary::before { content: "−"; }
.asbab-body { display: grid; gap: 18px; padding-top: 16px; }
.asbab-body .label { display: block; margin-bottom: 2px; }
.quiet { color: var(--dim); font-style: italic; margin: 0; }

/* Surah as a whole */
.whole { display: grid; gap: 40px; }
.whole h2 { margin: 0; text-align: center; font-family: var(--f-display); font-weight: 500; font-size: 30px; }
.pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 28px; }
.pair h4 { margin: 0 0 8px; font-family: var(--f-display); font-size: 21px; font-weight: 600; }
.stack { display: grid; gap: 16px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 20px; justify-content: center; font-family: var(--f-ui); font-size: 12.5px; color: var(--dim); padding-top: 24px; border-top: 1px solid var(--line); }

/* Word card */
#card { position: fixed; z-index: 30; width: min(380px, calc(100vw - 24px)); max-height: min(72vh, 620px); overflow: auto; background: var(--raised); border: 1px solid var(--line); border-radius: 14px; padding: 18px 18px 16px; display: grid; gap: 14px; box-shadow: 0 18px 50px rgba(0, 0, 0, .55); }
#card .c-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
#card .c-ar { font-family: var(--f-ar); font-size: 44px; line-height: 1.5; color: var(--gold); direction: rtl; }
#card .c-tr { font-family: var(--f-display); font-style: italic; font-size: 22px; }
#card .c-root { font-family: var(--f-ui); font-size: 13px; color: var(--muted); }
#card .c-root .r-ar { font-family: var(--f-ar); font-size: 19px; color: var(--text); unicode-bidi: isolate; direction: rtl; }
#card .close { font-family: var(--f-ui); color: var(--dim); font-size: 20px; line-height: 1; padding: 2px 4px; }
#card .close:hover { color: var(--gold); }
#card .sect { display: grid; gap: 6px; }
#card .sect > .label { font-size: 10.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-family: var(--f-ui); font-size: 13.5px; border: 1px solid var(--line); color: var(--muted); border-radius: 99px; padding: 2px 10px; display: inline-flex; gap: 6px; align-items: center; }
.chip.used { border-color: var(--gold); color: var(--gold); }
.chip.used::before { content: "✦"; font-size: 9px; }
.chip button { color: inherit; opacity: .7; padding: 0; font-size: 12px; }
#card ul { margin: 0; padding-left: 18px; font-size: 15.5px; }
#card .claim > p { font-size: 15.5px; }
#card .special { border-left: 1px solid var(--gold); padding-left: 12px; }
#card .lex { font-family: var(--f-ui); font-size: 12px; color: var(--dim); }
#card .efields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; }
#card .efields .f { display: grid; gap: 2px; min-width: 0; }
#card .erow { display: flex; flex-wrap: wrap; gap: 6px; justify-content: space-between; }
@media (max-width: 640px) {
  #card { left: 0 !important; right: 0; bottom: 0; top: auto !important; width: 100%; max-height: 78vh; border-radius: 16px 16px 0 0; border-bottom: 0;
    padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
}

/* Edit mode */
[contenteditable="true"] { outline: none; border-bottom: 1px dashed rgba(232, 184, 74, .45); cursor: text; min-width: 1.5em; display: inline-block; }
p[contenteditable="true"], div[contenteditable="true"] { display: block; }
[contenteditable="true"]:focus { border-bottom-color: var(--gold); background: var(--gold-faint); }
[contenteditable="true"]:empty::before { content: attr(data-ph); color: var(--dim); font-style: italic; }
.ebtn { font-family: var(--f-ui); font-size: 12px; letter-spacing: .06em; color: var(--gold); border: 1px dashed rgba(232, 184, 74, .5); border-radius: 99px; padding: 2px 11px; justify-self: start; }
.ebtn:hover { background: var(--gold-faint); }
.ebtn.x { color: var(--verify); border-color: rgba(241, 154, 140, .5); }
.ebtn.x:hover { background: rgba(241, 154, 140, .1); }
.ebar-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tag-btn { font: inherit; padding: 0; }
.tag-btn:hover { text-decoration: underline; }

#ebar { position: fixed; z-index: 25; left: 0; right: 0; bottom: 0; background: var(--raised); border-top: 1px solid var(--line);
  padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px)); padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
#ebar .in { max-width: 860px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-family: var(--f-ui); font-size: 13px; }
#ebar .status { color: var(--dim); flex: 1 1 160px; min-width: 0; }
#ebar .btn { border: 1px solid var(--line); border-radius: 99px; padding: 4px 12px; color: var(--muted); }
#ebar .btn:hover { border-color: var(--gold); color: var(--gold); }
#ebar .btn.armed { border-color: var(--verify); color: var(--verify); }
#ebar .count-bad { color: var(--verify); }
#ebar .count-ok { color: var(--t-consensus); }
#issues { max-width: 860px; margin: 0 auto 10px; max-height: 36vh; overflow: auto; display: grid; gap: 6px; font-family: var(--f-ui); font-size: 13px; }
#issues a { display: block; color: var(--text); text-decoration: none; padding: 6px 10px; border-left: 2px solid var(--verify); background: var(--night); border-radius: 0 6px 6px 0; }
#issues a.warn { border-left-color: var(--gold); }
#issues a span { color: var(--dim); display: block; font-size: 11.5px; letter-spacing: .04em; }

#modal { position: fixed; inset: 0; z-index: 40; background: rgba(8, 6, 15, .8); display: grid; place-items: center; padding: 18px; }
#modal .box { width: min(640px, 100%); background: var(--raised); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 12px; font-family: var(--f-ui); font-size: 14px; }
#modal textarea { width: 100%; min-height: 220px; background: var(--night); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font: 12.5px/1.45 ui-monospace, Menlo, monospace; }
#modal .err { color: var(--verify); }

@media (max-width: 640px) {
  body { font-size: 16.5px; }
  .hero { padding-block: 36px 16px; }
  .layer { grid-template-columns: 1.6em minmax(0, 1fr); gap: 4px 10px; }
  .divider { margin-block: 44px 30px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script type="application/json" id="seed">{"schema": 2, "surah": {"number": 112, "nameAr": "الإخلاص", "nameTr": "al-Ikhlāṣ", "nameEn": "Sincerity", "verseCount": 4, "tagline": "Four verses that say who God is, and who He is not.", "status": "Draft · items marked verify need scholar review", "theme": [{"text": "The surah is a complete statement of tawḥīd: who God is (One, al-Ṣamad) and what He is not (not begetting, not begotten, without equal).", "tag": "consensus", "scholar": "", "source": "General tafsir: al-Ṭabarī, Ibn Kathīr, al-Qurṭubī on 112", "review": false}, {"text": "The Prophet ﷺ said that this surah equals a third of the Qurʾān.", "tag": "consensus", "scholar": "", "source": "Ṣaḥīḥ al-Bukhārī 5013, from Abū Saʿīd al-Khudrī", "review": false}, {"text": "Scholars explain the \"third\" in different ways. One common explanation: the Qurʾān's content falls into rulings, narratives, and the description of God, and this surah gathers the third kind.", "tag": "scholar", "scholar": "Reported in al-Qurṭubī among other explanations", "source": "al-Qurṭubī, al-Jāmiʿ li-Aḥkām al-Qurʾān, on 112", "review": true}], "miracle": [{"topic": "Sound", "title": "One rhyme, one Lord", "text": "All four verses end on the sound -ad: aḥad, ṣamad, yūlad, aḥad. The final dāl is a qalqala letter, which ends each verse with a short, firm stop.", "tag": "consensus", "scholar": "", "source": "", "review": false}, {"topic": "Sound", "title": "Each verse sealed", "text": "Because every verse lands on a closed, firm sound, each statement about God feels complete and final when recited. Nothing trails off.", "tag": "reflection", "scholar": "", "source": "", "review": false}, {"topic": "Structure", "title": "Fifteen words", "text": "In fifteen Arabic words the surah affirms two things (He is One, He is al-Ṣamad) and denies three (begetting, being begotten, having any equal). Nothing is repeated except the name Allāh and the word aḥad.", "tag": "reflection", "scholar": "", "source": "", "review": false}, {"topic": "Structure", "title": "Opens and closes with aḥad", "text": "The surah's statement begins with aḥad (verse 1) and ends with aḥad (verse 4). The first affirms that He is One; the last denies that anyone is like Him.", "tag": "reflection", "scholar": "", "source": "", "review": false}], "revelation": {"text": "Most scholars count the surah as Makkan; others count it as Madinan. The difference follows the reports about who asked the question that it answers (see verse 1).", "tag": "scholar", "scholar": "Both positions are discussed by Ibn ʿĀshūr", "source": "Ibn ʿĀshūr, al-Taḥrīr wa-l-Tanwīr, introduction to 112", "review": true}, "links": {"previous": {"surah": "al-Masad (111)", "claims": [{"text": "al-Masad names a man by his kunya, Abū Lahab, and says his wealth and what he earned will not save him. al-Ikhlāṣ follows with the One who has no lineage and needs nothing. Human lineage and wealth fail; God is beyond both.", "tag": "reflection", "scholar": "", "source": "", "review": false}]}, "next": {"surah": "al-Falaq (113)", "claims": [{"text": "al-Ikhlāṣ, al-Falaq and al-Nās all open with \"qul\" (say). The Prophet ﷺ would recite the three together before sleeping.", "tag": "consensus", "scholar": "", "source": "Ṣaḥīḥ al-Bukhārī, Book of the Virtues of the Qurʾān, from ʿĀʾisha", "review": true}, {"text": "al-Ikhlāṣ first establishes who God is; al-Falaq and al-Nās then seek refuge in Him. Knowing the One comes before asking Him for protection.", "tag": "reflection", "scholar": "", "source": "", "review": false}]}}, "ring": {"supported": false, "claim": {"text": "No ring structure is claimed. Four short verses are too few to establish one; the aḥad framing is noted above as a reflection.", "tag": "reflection", "scholar": "", "source": "", "review": false}}}, "verses": [{"n": 1, "words": [{"ar": "قُلْ", "tr": "qul", "root": "ق و ل", "rootTr": "q-w-l", "rootMeaning": "speech, saying", "meanings": ["to say, to utter", "to state a view or belief", "speech held in the mind"], "translations": [{"text": "Say", "used": true}, {"text": "Declare", "used": false}, {"text": "Proclaim", "used": false}], "why": {"text": "Imperative form. The command is addressed to the Prophet ﷺ, and through him to everyone who recites it.", "tag": "consensus", "scholar": "", "source": "", "review": false}, "special": null, "lexSource": "al-Rāghib, al-Mufradāt, entry q-w-l; Lane's Lexicon, q-w-l", "lexReview": true}, {"ar": "هُوَ", "tr": "huwa", "root": "", "rootTr": "pronoun, no root", "rootMeaning": "", "meanings": ["he / it (third person, masculine singular)", "the matter, the fact (ḍamīr al-shaʾn)"], "translations": [{"text": "He", "used": true}, {"text": "The truth is / The matter is", "used": true}], "why": {"text": "The pronoun can point back to the one asked about, or it can be the pronoun of the matter, which announces that a weighty statement follows.", "tag": "scholar", "scholar": "al-Zamakhsharī", "source": "al-Kashshāf, on 112:1", "review": true}, "special": null, "lexSource": "", "lexReview": false}, {"ar": "ٱللَّهُ", "tr": "Allāhu", "root": "أ ل ه", "rootTr": "ʾ-l-h (disputed)", "rootMeaning": "worship, the one worshipped", "meanings": ["the proper name of God"], "translations": [{"text": "Allah", "used": true}, {"text": "God", "used": false}], "why": {"text": "Scholars differ on whether the name is derived (from ilāh, \"the one who is worshipped\") or is a proper name with no derivation. Both views are old, and this study does not choose between them.", "tag": "scholar", "scholar": "al-Rāghib discusses the derivation; the disagreement is reported among grammarians", "source": "al-Rāghib, al-Mufradāt, entry ʾ-l-h", "review": true}, "special": {"text": "A proper name used only for the one true God. Grammarians note that it takes no plural and no dual.", "tag": "consensus", "scholar": "", "source": "", "review": true}, "lexSource": "al-Rāghib, al-Mufradāt, entry ʾ-l-h", "lexReview": true}, {"ar": "أَحَدٌ", "tr": "aḥadun", "root": "و ح د", "rootTr": "w-ḥ-d (hamza replaces an original wāw)", "rootMeaning": "oneness, being alone", "meanings": ["one", "single, alone", "unique, with no second", "(after a negation) anyone at all"], "translations": [{"text": "One", "used": true}, {"text": "Unique", "used": true}, {"text": "the One", "used": false}, {"text": "Single", "used": false}], "why": {"text": "In an affirmative sentence, aḥad in this absolute sense is used only of God. Elsewhere it mostly comes after a negation, meaning \"anyone\".", "tag": "scholar", "scholar": "al-Rāghib al-Iṣfahānī", "source": "al-Mufradāt, entry aḥad", "review": true}, "special": {"text": "When Bilāl ibn Rabāḥ was tortured in Makkah to make him give up Islam, he kept repeating one word: \"Aḥad, aḥad.\"", "tag": "scholar", "scholar": "Ibn Isḥāq's Sīra, as transmitted by Ibn Hishām", "source": "al-Sīra al-Nabawiyya", "review": true}, "lexSource": "al-Rāghib, al-Mufradāt, entry aḥad; Ibn Fāris, Maqāyīs, w-ḥ-d", "lexReview": true}], "literal": "Say: He [is] Allah, one.", "layers": [{"reading": "\"He\" is the Lord they asked about", "translation": "Say: He is Allah, the One.", "explanation": {"text": "People asked about the Prophet's Lord. The pronoun huwa points back to the One they asked about, and the answer names Him.", "tag": "scholar", "scholar": "al-Zamakhsharī", "source": "al-Kashshāf, on 112:1", "review": true}, "tafsir": [{"text": "Say, O Muhammad, to those who asked you about your Lord: He is Allah, One.", "tag": "scholar", "scholar": "al-Ṭabarī", "source": "Jāmiʿ al-Bayān, on 112:1", "review": true}, {"text": "He is the One, the Unique, with no peer, no helper, no rival, no likeness and no equal.", "tag": "scholar", "scholar": "Ibn Kathīr", "source": "Tafsīr Ibn Kathīr, on 112:1", "review": true}]}, {"reading": "\"He\" announces a great truth", "translation": "Say: The truth is this: Allah is One.", "explanation": {"text": "huwa can be ḍamīr al-shaʾn, the \"pronoun of the matter\". Arabic uses it to draw attention before a statement of great weight, like saying \"Here is the truth:\".", "tag": "scholar", "scholar": "al-Zamakhsharī", "source": "al-Kashshāf, on 112:1", "review": true}, "tafsir": [{"text": "Mentions this reading alongside the first: the pronoun stands for \"the matter\", and \"Allāhu aḥad\" is the matter it introduces.", "tag": "scholar", "scholar": "al-Zamakhsharī", "source": "al-Kashshāf, on 112:1", "review": true}]}, {"reading": "aḥad as \"indivisible\"", "translation": "Say: He is Allah, One without parts.", "explanation": {"text": "aḥad does more than count to one. It denies a second like Him, and it also denies that He is made of parts.", "tag": "reflection", "scholar": "", "source": "", "review": true}, "tafsir": [{"text": "Explains aḥad, when used of God, as the one that admits no plurality in any respect.", "tag": "scholar", "scholar": "al-Rāghib al-Iṣfahānī", "source": "al-Mufradāt, entry aḥad", "review": true}]}], "miracle": [{"topic": "Word choice", "title": "Aḥad, not wāḥid", "text": "Arabic has two words for one. wāḥid can begin a count (one, two, three), so it leaves room for a second. aḥad, used of God, closes that door: no second, and no division.", "tag": "scholar", "scholar": "al-Rāghib al-Iṣfahānī", "source": "al-Mufradāt, entries aḥad and w-ḥ-d", "review": true}, {"topic": "Definite / indefinite", "title": "Indefinite on purpose", "text": "The verse says aḥadun, not al-aḥad. The indefinite suggests a oneness that belongs to no category. He is not \"the one\" of a known group.", "tag": "reflection", "scholar": "", "source": "", "review": false}, {"topic": "Rhetoric", "title": "Why \"Say\" stays", "text": "The command \"qul\" is kept in the recited words. The reciter repeats what they were told to say, which marks the surah as a message passed on, not something composed.", "tag": "reflection", "scholar": "", "source": "", "review": false}], "asbab": {"exists": true, "narration": {"text": "Ubayy ibn Kaʿb reported that the polytheists said to the Prophet ﷺ: \"Describe your Lord's lineage to us,\" and God revealed this surah.", "tag": "scholar", "scholar": "Recorded by al-Tirmidhī and Aḥmad", "source": "Jāmiʿ al-Tirmidhī, Book of Tafsīr, on 112; Musnad Aḥmad", "review": true}, "grading": {"text": "al-Tirmidhī also gives the report without Ubayy (mursal, from Abū al-ʿĀliya) and says that version is more correct. The connected chain includes Abū Jaʿfar al-Rāzī, about whom the hadith critics differ. Later graders disagree on whether it is ḥasan or weak.", "tag": "scholar", "scholar": "al-Tirmidhī", "source": "Jāmiʿ al-Tirmidhī, on 112", "review": true}, "disagreement": {"text": "Other reports say the question came from Jews of Madinah, not from the Quraysh. al-Ṭabarī collects reports on both sides. This is where the Makkan or Madinan disagreement comes from.", "tag": "scholar", "scholar": "al-Ṭabarī", "source": "Jāmiʿ al-Bayān, on 112", "review": true}}}, {"n": 2, "words": [{"ar": "ٱللَّهُ", "tr": "Allāhu", "root": "أ ل ه", "rootTr": "ʾ-l-h (disputed)", "rootMeaning": "worship, the one worshipped", "meanings": ["the proper name of God"], "translations": [{"text": "Allah", "used": true}, {"text": "God", "used": false}], "why": {"text": "See verse 1 for the disagreement on the name's derivation.", "tag": "consensus", "scholar": "", "source": "", "review": false}, "special": null, "lexSource": "", "lexReview": false}, {"ar": "ٱلصَّمَدُ", "tr": "al-Ṣamadu", "root": "ص م د", "rootTr": "ṣ-m-d", "rootMeaning": "to aim for; to be solid", "meanings": ["to aim for, to turn to (qaṣd)", "solid, without hollow (ṣalāba)", "the master to whom people turn in their needs", "the master perfect in his mastery", "the one who remains, the Everlasting"], "translations": [{"text": "the Eternal Refuge", "used": true}, {"text": "the Self-Sufficient", "used": true}, {"text": "the Master", "used": true}, {"text": "the Everlasting", "used": true}, {"text": "the Absolute", "used": false}], "why": {"text": "Ibn Fāris gives the root two core senses: aiming for something, and solidity. The early exegetes explain al-Ṣamad with several meanings built on these, and al-Ṭabarī collects their reports. All of them are carried at once.", "tag": "scholar", "scholar": "Ibn Fāris; al-Ṭabarī", "source": "Maqāyīs al-Lugha, ṣ-m-d; Jāmiʿ al-Bayān, on 112:2", "review": true}, "special": {"text": "In the narration of Ubayy ibn Kaʿb, al-Ṣamad is explained by the next verse: the One who does not beget and was not begotten, because everything born will die and everything that dies is inherited, and God does not die and is not inherited.", "tag": "scholar", "scholar": "Narration of Ubayy ibn Kaʿb, recorded by al-Tirmidhī", "source": "Jāmiʿ al-Tirmidhī, Book of Tafsīr, on 112", "review": true}, "lexSource": "Ibn Fāris, Maqāyīs, ṣ-m-d; Lane's Lexicon, ṣ-m-d", "lexReview": true}], "literal": "Allah [is] the Ṣamad.", "layers": [{"reading": "The One everyone turns to", "translation": "Allah is the One to whom all turn in their needs.", "explanation": {"text": "From the root sense of aiming for and turning to: every creature, knowingly or not, is headed toward Him in its need.", "tag": "reflection", "scholar": "", "source": "", "review": false}, "tafsir": [{"text": "Reports from early exegetes explain al-Ṣamad as the master to whom people turn when they need something.", "tag": "scholar", "scholar": "Reports collected by al-Ṭabarī", "source": "Jāmiʿ al-Bayān, on 112:2", "review": true}]}, {"reading": "Solid, needing nothing", "translation": "Allah is the Self-Sufficient, with no hollowness and no need.", "explanation": {"text": "From the root sense of solidity: something with no hollow inside, nothing that needs filling. He neither eats nor drinks.", "tag": "reflection", "scholar": "", "source": "", "review": false}, "tafsir": [{"text": "A group of the early exegetes explained al-Ṣamad as the one who has no hollow inside.", "tag": "scholar", "scholar": "Reported by al-Ṭabarī and Ibn Kathīr", "source": "Jāmiʿ al-Bayān and Tafsīr Ibn Kathīr, on 112:2", "review": true}]}, {"reading": "Perfect in mastery", "translation": "Allah is the Master, perfect in His mastery.", "explanation": {"text": "A ṣamad among the Arabs was a chief whom people relied on. Applied to God, the word means a mastery with no flaw or limit.", "tag": "reflection", "scholar": "", "source": "", "review": true}, "tafsir": [{"text": "The master who is perfect in his mastery, the noble who is perfect in his nobility, perfect in knowledge, wisdom and every attribute.", "tag": "scholar", "scholar": "Ibn ʿAbbās (through ʿAlī ibn Abī Ṭalḥa), as reported by Ibn Kathīr", "source": "Tafsīr Ibn Kathīr, on 112:2", "review": true}]}, {"reading": "The Everlasting", "translation": "Allah is the Everlasting, who remains after His creation.", "explanation": {"text": "The one who remains when everything else ends.", "tag": "reflection", "scholar": "", "source": "", "review": false}, "tafsir": [{"text": "al-Ṣamad is the Everlasting, who remains after His creation.", "tag": "scholar", "scholar": "al-Ḥasan al-Baṣrī and Qatāda, as reported by Ibn Kathīr", "source": "Tafsīr Ibn Kathīr, on 112:2", "review": true}]}], "miracle": [{"topic": "Word choice", "title": "A word used once", "text": "al-Ṣamad appears only here in the whole Qurʾān. One rare word holds what English needs four words for: refuge, self-sufficient, master, everlasting.", "tag": "consensus", "scholar": "", "source": "", "review": true}, {"topic": "Definite / indefinite", "title": "Both ends definite", "text": "Both parts of the sentence are definite: Allāh, al-Ṣamad. In Arabic rhetoric this pattern can express exclusivity: Allah, and only Allah, is al-Ṣamad.", "tag": "scholar", "scholar": "Ibn ʿĀshūr", "source": "al-Taḥrīr wa-l-Tanwīr, on 112:2", "review": true}, {"topic": "Word order", "title": "The name, repeated", "text": "The verse repeats the name Allāh instead of saying \"He is al-Ṣamad\". Each verse then stands on its own as a full statement about God by name.", "tag": "reflection", "scholar": "", "source": "", "review": false}, {"topic": "Rhetoric", "title": "No \"and\"", "text": "There is no \"and\" between verse 1 and verse 2. The second follows directly, as if it explains the first.", "tag": "reflection", "scholar": "", "source": "", "review": true}], "asbab": {"exists": false, "note": "No separate narration for this verse. See verse 1 for the surah as a whole."}}, {"n": 3, "words": [{"ar": "لَمْ", "tr": "lam", "root": "", "rootTr": "particle, no root", "rootMeaning": "", "meanings": ["not (negates the past; puts the verb in the jussive)"], "translations": [{"text": "did not", "used": true}, {"text": "has not", "used": true}, {"text": "never", "used": false}], "why": {"text": "lam with the present-form verb gives a past negation: \"did not\".", "tag": "consensus", "scholar": "", "source": "", "review": false}, "special": null, "lexSource": "", "lexReview": false}, {"ar": "يَلِدْ", "tr": "yalid", "root": "و ل د", "rootTr": "w-l-d", "rootMeaning": "birth, offspring", "meanings": ["to beget, to father", "to give birth"], "translations": [{"text": "beget", "used": true}, {"text": "father", "used": false}, {"text": "give birth", "used": false}], "why": {"text": "Active voice, with God as the subject. It denies that He has a child.", "tag": "consensus", "scholar": "", "source": "", "review": false}, "special": {"text": "This answers people who claimed God has a son (2:116, 19:88) and the Arabs who called the angels His daughters (16:57, 37:149).", "tag": "consensus", "scholar": "", "source": "Qurʾān 2:116, 19:88, 16:57, 37:149", "review": false}, "lexSource": "Ibn Fāris, Maqāyīs, w-l-d; Lane's Lexicon, w-l-d", "lexReview": true}, {"ar": "وَلَمْ", "tr": "wa-lam", "root": "", "rootTr": "conjunction + particle", "rootMeaning": "", "meanings": ["and not"], "translations": [{"text": "and not", "used": true}, {"text": "nor", "used": false}], "why": {"text": "wa joins the second negation to the first.", "tag": "consensus", "scholar": "", "source": "", "review": false}, "special": null, "lexSource": "", "lexReview": false}, {"ar": "يُولَدْ", "tr": "yūlad", "root": "و ل د", "rootTr": "w-l-d", "rootMeaning": "birth, offspring", "meanings": ["to be begotten, to be born"], "translations": [{"text": "be begotten", "used": true}, {"text": "be born", "used": false}], "why": {"text": "Passive voice of the same root. It denies that He has a parent or any origin.", "tag": "consensus", "scholar": "", "source": "", "review": false}, "special": {"text": "Having no parent means having no beginning. Compare 57:3: \"He is the First and the Last.\"", "tag": "reflection", "scholar": "", "source": "", "review": false}, "lexSource": "", "lexReview": false}], "literal": "Not [has He] begotten, and not [has He] been begotten.", "layers": [{"reading": "A plain denial", "translation": "He has not begotten, and He has not been begotten.", "explanation": {"text": "The plain meaning of lam with the jussive: neither of these has happened.", "tag": "consensus", "scholar": "", "source": "", "review": false}, "tafsir": [{"text": "How could He have a son when He has no companion? (6:101). The Qurʾān answers the same claim in several places.", "tag": "consensus", "scholar": "", "source": "Qurʾān 6:101; 19:88–92", "review": false}, {"text": "He has no child, no parent and no consort.", "tag": "scholar", "scholar": "Ibn Kathīr", "source": "Tafsīr Ibn Kathīr, on 112:3", "review": true}]}, {"reading": "Never, at any time", "translation": "He never begets, and He was never begotten.", "explanation": {"text": "The verse describes God's nature, so the past negation can be read as covering all time.", "tag": "reflection", "scholar": "", "source": "", "review": true}, "tafsir": [{"text": "Everything that is born will die, and everything that dies is inherited. God does not die and is not inherited.", "tag": "scholar", "scholar": "Narration of Ubayy ibn Kaʿb, recorded by al-Tirmidhī", "source": "Jāmiʿ al-Tirmidhī, Book of Tafsīr, on 112", "review": true}]}], "miracle": [{"topic": "Word order", "title": "Begetting comes first", "text": "\"Has not begotten\" comes before \"has not been begotten\". People had claimed that God has children; nobody claimed that He was born. The verse answers the claim that was actually made first.", "tag": "reflection", "scholar": "", "source": "A common explanation in tafsir; a named source is still needed", "review": true}, {"topic": "Rhetoric", "title": "One root, two directions", "text": "The same root in two voices: yalid (begets) and yūlad (is begotten). Together they close off both directions: no descendants, no ancestors.", "tag": "reflection", "scholar": "", "source": "", "review": false}, {"topic": "Sound", "title": "Perfect balance", "text": "Two halves of equal length and pattern: lam yalid / wa-lam yūlad. The balance itself sounds like a closed matter.", "tag": "consensus", "scholar": "", "source": "", "review": false}], "asbab": {"exists": false, "note": "No separate narration for this verse. See verse 1 for the surah as a whole."}}, {"n": 4, "words": [{"ar": "وَلَمْ", "tr": "wa-lam", "root": "", "rootTr": "conjunction + particle", "rootMeaning": "", "meanings": ["and not"], "translations": [{"text": "and not", "used": true}, {"text": "and never", "used": true}], "why": {"text": "Past negation, joined to the previous verse.", "tag": "consensus", "scholar": "", "source": "", "review": false}, "special": null, "lexSource": "", "lexReview": false}, {"ar": "يَكُن", "tr": "yakun", "root": "ك و ن", "rootTr": "k-w-n", "rootMeaning": "being, existing", "meanings": ["to be", "to exist, to come about"], "translations": [{"text": "has been", "used": true}, {"text": "is", "used": false}, {"text": "exists", "used": false}], "why": {"text": "kāna works here as a linking verb. Its subject is aḥad and its predicate is kufuwan.", "tag": "scholar", "scholar": "al-Zamakhsharī", "source": "al-Kashshāf, on 112:4", "review": true}, "special": null, "lexSource": "", "lexReview": false}, {"ar": "لَّهُۥ", "tr": "lahu", "root": "", "rootTr": "preposition + pronoun", "rootMeaning": "", "meanings": ["for Him, to Him"], "translations": [{"text": "to Him", "used": true}, {"text": "for Him", "used": false}], "why": {"text": "li (for, to) with the pronoun hu (Him).", "tag": "consensus", "scholar": "", "source": "", "review": false}, "special": null, "lexSource": "", "lexReview": false}, {"ar": "كُفُوًا", "tr": "kufuwan", "root": "ك ف أ", "rootTr": "k-f-ʾ", "rootMeaning": "equality, being a match", "meanings": ["an equal, a match", "a peer in rank or standing", "a counterpart"], "translations": [{"text": "equal", "used": true}, {"text": "peer", "used": true}, {"text": "match", "used": false}, {"text": "comparable", "used": false}], "why": {"text": "kufuʾ is a match or peer: someone of the same standing.", "tag": "scholar", "scholar": "Lane; Ibn Fāris", "source": "Lane's Lexicon, k-f-ʾ; Maqāyīs, k-f-ʾ", "review": true}, "special": {"text": "The same word family gives kafāʾa, the term in Islamic law for two spouses being suitable matches in standing. The verse denies that anyone is God's \"match\" in that sense.", "tag": "consensus", "scholar": "", "source": "", "review": false}, "lexSource": "Ibn Fāris, Maqāyīs, k-f-ʾ; Lane's Lexicon, k-f-ʾ", "lexReview": true}, {"ar": "أَحَدٌۢ", "tr": "aḥadun", "root": "و ح د", "rootTr": "w-ḥ-d", "rootMeaning": "oneness, being alone", "meanings": ["one", "(after a negation) anyone at all"], "translations": [{"text": "anyone", "used": true}, {"text": "no one (with the negation)", "used": true}, {"text": "one", "used": false}], "why": {"text": "After a negation, aḥad covers every possible individual: no one at all.", "tag": "scholar", "scholar": "al-Rāghib al-Iṣfahānī", "source": "al-Mufradāt, entry aḥad", "review": true}, "special": null, "lexSource": "al-Rāghib, al-Mufradāt, entry aḥad", "lexReview": true}], "literal": "And not has been for Him [an] equal, [any] one.", "layers": [{"reading": "No one is His equal", "translation": "And there has never been anyone equal to Him.", "explanation": {"text": "The usual parsing: the predicate kufuwan is placed before the subject aḥad.", "tag": "scholar", "scholar": "al-Zamakhsharī", "source": "al-Kashshāf, on 112:4", "review": true}, "tafsir": [{"text": "There is nothing like Him (42:11). No one shares His essence, attributes or actions.", "tag": "consensus", "scholar": "", "source": "Qurʾān 42:11", "review": false}, {"text": "He has no equal, no likeness and no rival.", "tag": "scholar", "scholar": "Ibn Kathīr", "source": "Tafsīr Ibn Kathīr, on 112:4", "review": true}]}, {"reading": "No one stands toward Him as an equal", "translation": "And no one has ever stood toward Him as an equal.", "explanation": {"text": "Some grammarians allow kufuwan as a ḥāl (a word describing a state). Confirm the source before keeping this layer.", "tag": "scholar", "scholar": "Reported in works of iʿrāb, possibly al-Samīn al-Ḥalabī, al-Durr al-Maṣūn", "source": "", "review": true}, "tafsir": []}], "miracle": [{"topic": "Word order", "title": "\"To Him\", placed first", "text": "lahu (to Him) comes before kufuwan (an equal), although such a phrase would normally come later. It is moved forward because the point is to deny an equal to God specifically.", "tag": "scholar", "scholar": "al-Zamakhsharī", "source": "al-Kashshāf, on 112:4", "review": true}, {"topic": "Word choice", "title": "Kufuw, not mithl", "text": "The verse uses kufuw (an equal in rank), not mithl (a likeness) or nidd (a rival). So it denies anyone who could stand at God's level, not only anyone who looks like Him.", "tag": "reflection", "scholar": "", "source": "", "review": false}, {"topic": "Structure", "title": "The final aḥad", "text": "The surah ends on the same word that ended its first verse. In verse 1 aḥad means \"One\"; here, after a negation, it means \"anyone\". The same word affirms His oneness and denies every rival.", "tag": "reflection", "scholar": "", "source": "", "review": false}], "asbab": {"exists": false, "note": "No separate narration for this verse. See verse 1 for the surah as a whole."}}]}</script>
<script>
(function () {
  "use strict";
  const SEED = JSON.parse(document.getElementById("seed").textContent);
  const KEY = "motw-surah-" + SEED.surah.number;
  const TAGS = { consensus: "Consensus", scholar: "Scholar's view", reflection: "Reflection" };
  const ORDER = ["consensus", "scholar", "reflection"];
  const BANNED = [
    { re: /qir[aā]['ʾ’]?[aā]t|qira'a|variant reading/i, msg: "Mentions qiraʾāt. Project rule: no different qiraʾāt." },
    { re: /scien(ce|tific)|modern discover/i, msg: "Possible scientific miracle claim. Project rule: none." }
  ];
  const AR = (n) => String(n).replace(/\d/g, (d) => "٠١٢٣٤٥٦٧٨٩"[d]);
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const blank = () => ({ text: "", tag: "", scholar: "", source: "", review: false });
  const NEW = {
    claim: blank,
    note: () => Object.assign({ topic: "Word choice", title: "" }, blank()),
    layer: () => ({ reading: "", translation: "", explanation: blank(), tafsir: [] }),
    word: () => ({ ar: "", tr: "", root: "", rootTr: "", rootMeaning: "", meanings: [], translations: [], why: blank(), special: null, lexSource: "", lexReview: false }),
    translation: () => ({ text: "", used: false }),
    text: () => ""
  };

  let doc = load();
  let editing = false;

  function load() {
    try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && d.surah && Array.isArray(d.verses)) return d; } catch (e) { /* no saved copy */ }
    return clone(SEED);
  }
  let saveT = null;
  function save() {
    status("Saving…");
    clearTimeout(saveT);
    saveT = setTimeout(() => {
      try { localStorage.setItem(KEY, JSON.stringify(doc)); status("Saved in this browser"); }
      catch (e) { status("Not saved: this browser blocks storage. Use Copy JSON."); }
    }, 300);
  }
  function status(t) { document.getElementById("status").textContent = t; }

  const get = (p) => p.split(".").reduce((o, k) => (o == null ? o : o[k]), doc);
  function set(p, v) { const ks = p.split("."), last = ks.pop(); ks.reduce((o, k) => o[k], doc)[last] = v; }

  /* ---------- Building blocks ---------- */
  // Editable text. In read mode it is plain text; in edit mode the same element becomes editable in place.
  function ed(p, tag, cls, ph, ar) {
    tag = tag || "span";
    const v = get(p);
    const a = (cls ? ' class="' + cls + '"' : "") + (ar ? ' dir="rtl" lang="ar"' : "");
    if (!editing) return "<" + tag + a + ">" + esc(v) + "</" + tag + ">";
    return "<" + tag + a + ' contenteditable="true" spellcheck="' + (ar ? "false" : "true") + '" data-path="' + p + '" data-ph="' + esc(ph || "Write here") + '">' + esc(v) + "</" + tag + ">";
  }
  const btn = (attrs, label, x) => editing ? '<button type="button" class="ebtn' + (x ? " x" : "") + '" ' + attrs + ">" + label + "</button>" : "";
  const addBtn = (p, kind, label) => btn('data-add="' + p + '" data-kind="' + kind + '"', "+ " + label);
  const delBtn = (p, label) => btn('data-del="' + p + '"', label || "Remove", true);

  function byline(p) {
    const c = get(p);
    let h = '<div class="by">';
    if (editing) {
      h += '<button type="button" class="tag-btn tag ' + (c.tag || "none") + '" data-cycle="' + p + '" title="Click to change the tag">' + (c.tag ? TAGS[c.tag] : "Choose tag") + "</button>";
      if (c.tag === "scholar") h += ed(p + ".scholar", "span", "", "Scholar's name");
      h += ed(p + ".source", "span", "", "Source");
      h += '<button type="button" class="verify' + (c.review ? "" : " off") + '" data-toggle="' + p + '.review">' + (c.review ? "verify" : "mark verify") + "</button>";
    } else {
      h += '<span class="tag ' + (c.tag || "none") + '">' + (c.tag === "scholar" ? esc(c.scholar || "Scholar's view") : c.tag ? TAGS[c.tag] : "No tag") + "</span>";
      if (c.source) h += "<span>" + esc(c.source) + "</span>";
      if (c.review) h += '<span class="verify">verify</span>';
    }
    return h + "</div>";
  }
  const claim = (p, ph) => '<div class="claim">' + ed(p + ".text", "p", "", ph || "Write the claim") + byline(p) + "</div>";

  function literalHtml(s) { return esc(s).replace(/\[([^\]]*)\]/g, '<span class="added">[$1]</span>'); }
  function wordsHtml(vi) {
    return doc.verses[vi].words.map((w, wi) => '<span class="w" role="button" tabindex="0" data-v="' + vi + '" data-w="' + wi + '">' + esc(w.ar) + "</span>").join(" ") +
      ' <span class="end">﴿' + AR(doc.verses[vi].n) + "﴾</span>";
  }

  /* ---------- Page ---------- */
  function render() {
    const s = doc.surah;
    let h = '<section class="hero">' +
      '<p class="name-ar" lang="ar">' + esc(s.nameAr) + "</p>" +
      "<h1>Sūrat " + esc(s.nameTr) + "</h1>" +
      '<div class="meta">' + esc(s.nameEn) + " · Surah " + s.number + " · " + doc.verses.length + " verses</div>" +
      ed("surah.tagline", "p", "tagline", "One line about the surah") + "</section>";

    h += '<section class="recite"><p class="mushaf" lang="ar">' + doc.verses.map((v, i) => wordsHtml(i)).join(" ") + "</p>" +
      '<p class="hint">' + (matchMedia("(hover: hover)").matches ? "Hover over a word to see its meanings" : "Tap a word to see its meanings") + "</p></section>";

    doc.verses.forEach((v, vi) => { h += '<div class="divider" aria-hidden="true">✦</div>' + verseHtml(v, vi); });
    h += '<div class="divider" aria-hidden="true">✦</div>' + wholeHtml();
    document.getElementById("main").innerHTML = h;
    if (editing) renderChecks();
  }

  function verseHtml(v, vi) {
    const b = "verses." + vi;
    let h = '<section class="verse" id="v' + v.n + '"><div class="v-label">Verse ' + v.n + "</div>" +
      '<p class="ayah" lang="ar">' + wordsHtml(vi) + "</p>";
    if (editing) h += '<div class="ebar-row" style="justify-content:center">' + addBtn(b + ".words", "word", "word") + '<span class="label">Click a word to edit it</span></div>';
    h += '<div class="literal"><span class="label">Word for word</span>' + (editing ? ed(b + ".literal", "p", "", "Literal translation, added words in [brackets]") : "<p>" + literalHtml(v.literal) + "</p>") + "</div>";

    // Layers
    h += '<div class="block"><h3>Layers of meaning</h3>';
    v.layers.forEach((l, li) => {
      const p = b + ".layers." + li;
      h += '<article class="layer"><span class="n">' + (li + 1) + '</span><div class="body">' +
        ed(p + ".reading", "span", "reading", "Which meaning this layer follows") +
        ed(p + ".translation", "p", "tl", "Clear English translation") +
        claim(p + ".explanation", "Explain this layer") +
        '<div class="tafsir"><span class="label">Tafsir</span>' +
        l.tafsir.map((t, ti) => tafsirHtml(p + ".tafsir." + ti)).join("") +
        (!l.tafsir.length && !editing ? '<p class="quiet">No tafsir recorded for this reading yet.</p>' : "") +
        addBtn(p + ".tafsir", "claim", "tafsir") + "</div>" +
        delBtn(p, "Remove layer") + "</div></article>";
    });
    h += addBtn(b + ".layers", "layer", "layer") + "</div>";

    // Miracle notes
    h += '<div class="block"><h3>The miracle in the words</h3><div class="notes">' +
      v.miracle.map((m, mi) => noteHtml(b + ".miracle." + mi)).join("") + "</div>" + addBtn(b + ".miracle", "note", "note") + "</div>";

    // Reason for revelation
    const a = v.asbab;
    if (a.exists || editing) {
      h += '<details class="asbab"' + (editing ? " open" : "") + "><summary>Reason for revelation</summary><div class=\"asbab-body\">";
      if (editing) h += '<div class="ebar-row">' + btn('data-toggle="' + b + '.asbab.exists" data-rerender="1"', a.exists ? "A narration exists ✓" : "No narration (click if one exists)") + "</div>";
      if (a.exists) {
        ["narration", "grading", "disagreement"].forEach((k) => { if (!a[k]) a[k] = blank(); });
        h += "<div><span class=\"label\">Narration</span>" + claim(b + ".asbab.narration") + "</div>" +
          "<div><span class=\"label\">Authenticity</span>" + claim(b + ".asbab.grading", "Grading of the narration") + "</div>" +
          (a.disagreement.text || editing ? "<div><span class=\"label\">Disagreement</span>" + claim(b + ".asbab.disagreement", "Other reports, if any") + "</div>" : "");
      } else {
        if (a.note == null) a.note = "";
        h += ed(b + ".asbab.note", "p", "quiet", "Note");
      }
      h += "</div></details>";
    }
    return h + "</section>";
  }

  function tafsirHtml(p) {
    const c = get(p);
    if (editing) return '<div class="tq">' + claim(p, "What the scholar says") + delBtn(p) + "</div>";
    const who = c.tag === "scholar" ? c.scholar : TAGS[c.tag] || "No tag";
    return '<div class="tq"><span class="who ' + (c.tag || "") + '">' + esc(who) + (c.review ? ' <span class="verify">verify</span>' : "") + "</span><p>" + esc(c.text) + "</p>" +
      (c.source ? '<div class="by"><span>' + esc(c.source) + "</span></div>" : "") + "</div>";
  }

  function noteHtml(p) {
    return '<div class="note">' + ed(p + ".topic", "span", "topic", "Topic") + ed(p + ".title", "h4", "", "Short title") + claim(p, "What makes this remarkable") + delBtn(p) + "</div>";
  }

  function wholeHtml() {
    const s = doc.surah;
    let h = '<section class="whole" id="whole"><h2>The surah as a whole</h2>';
    h += '<div class="block"><h3>The miracle in the surah</h3><div class="notes">' + s.miracle.map((m, i) => noteHtml("surah.miracle." + i)).join("") + "</div>" + addBtn("surah.miracle", "note", "note") + "</div>";
    h += '<div class="block"><h3>Central theme</h3><div class="stack">' + s.theme.map((c, i) => "<div>" + claim("surah.theme." + i) + delBtn("surah.theme." + i) + "</div>").join("") + "</div>" + addBtn("surah.theme", "claim", "claim") + "</div>";
    const link = (k, lbl) => '<div class="stack"><div><span class="label">' + lbl + "</span>" + ed("surah.links." + k + ".surah", "h4", "", "Surah name") + "</div>" +
      s.links[k].claims.map((c, i) => "<div>" + claim("surah.links." + k + ".claims." + i) + delBtn("surah.links." + k + ".claims." + i) + "</div>").join("") +
      addBtn("surah.links." + k + ".claims", "claim", "link") + "</div>";
    h += '<div class="block"><h3>Neighbouring surahs</h3><div class="pair">' + link("previous", "Before") + link("next", "After") + "</div></div>";
    h += '<div class="block"><h3>Place of revelation</h3>' + claim("surah.revelation") + "</div>";
    h += '<div class="block"><h3>Ring structure</h3>' + (editing ? '<div class="ebar-row">' + btn('data-toggle="surah.ring.supported" data-rerender="1"', s.ring.supported ? "Ring structure claimed ✓" : "No ring structure claimed") + "</div>" : "") + claim("surah.ring.claim") + "</div>";
    h += '<div class="legend"><span class="tag consensus">Consensus</span><span class="tag scholar">Scholar\'s view (named)</span><span class="tag reflection">Reflection</span><span><span class="verify">verify</span> needs scholar review</span></div>';
    return h + "</section>";
  }

  /* ---------- Word card ---------- */
  const card = document.getElementById("card");
  let cardAt = null, pinned = false, hideT = null;

  function cardHtml(vi, wi) {
    const w = doc.verses[vi].words[wi], p = "verses." + vi + ".words." + wi;
    let h = '<div class="c-head"><div>' + ed(p + ".ar", "div", "c-ar", "Arabic", true) + ed(p + ".tr", "div", "c-tr", "transliteration") + "</div>" +
      '<button type="button" class="close" data-close aria-label="Close">×</button></div>';
    if (editing) {
      h += '<div class="efields">' +
        '<div class="f"><span class="label">Root</span>' + ed(p + ".root", "span", "", "ج ذ ر", true) + "</div>" +
        '<div class="f"><span class="label">Root (Latin)</span>' + ed(p + ".rootTr", "span", "", "j-dh-r") + "</div>" +
        '<div class="f" style="grid-column:1/-1"><span class="label">Core sense of the root</span>' + ed(p + ".rootMeaning", "span", "", "Core sense") + "</div></div>";
    } else {
      h += '<div class="c-root">' + (w.root ? 'Root <span class="r-ar" lang="ar">' + esc(w.root) + "</span> · " : "") + esc(w.rootTr) + (w.rootMeaning ? " · " + esc(w.rootMeaning) : "") + "</div>";
    }
    h += '<div class="sect"><span class="label">Possible translations · ✦ meant here</span><div class="chips">' +
      w.translations.map((t, ti) => {
        const tp = p + ".translations." + ti;
        if (!editing) return '<span class="chip' + (t.used ? " used" : "") + '">' + esc(t.text) + "</span>";
        return '<span class="chip' + (t.used ? " used" : "") + '">' + ed(tp + ".text", "span", "", "translation") +
          '<button type="button" data-toggle="' + tp + '.used" data-card="1" title="Meant here?">' + (t.used ? "unmark" : "mark") + '</button><button type="button" data-del="' + tp + '" data-card="1" aria-label="Remove">×</button></span>';
      }).join("") + addBtnCard(p + ".translations", "translation", "add") + "</div></div>";
    h += '<div class="sect"><span class="label">Classical meanings</span><ul>' +
      w.meanings.map((m, mi) => "<li>" + ed(p + ".meanings." + mi, "span", "", "meaning") + (editing ? ' <button type="button" class="ebtn x" data-del="' + p + ".meanings." + mi + '" data-card="1">×</button>' : "") + "</li>").join("") + "</ul>" +
      addBtnCard(p + ".meanings", "text", "meaning") + "</div>";
    h += '<div class="sect"><span class="label">Why this meaning</span>' + claim(p + ".why") + "</div>";
    if (w.special) {
      h += '<div class="sect special"><span class="label">Beyond the dictionary</span>' + claim(p + ".special", "A meaning that comes from revelation, narration or usage") +
        (editing ? '<button type="button" class="ebtn x" data-unset="' + p + '.special">Remove</button>' : "") + "</div>";
    } else if (editing) {
      h += '<div class="sect"><button type="button" class="ebtn" data-setclaim="' + p + '.special">+ meaning beyond the dictionary</button></div>';
    }
    if (editing) {
      h += '<div class="sect"><span class="label">Lexicon sources</span>' + ed(p + ".lexSource", "span", "", "al-Mufradāt, Maqāyīs, Lane…") +
        '<div class="ebar-row"><button type="button" class="verify' + (w.lexReview ? "" : " off") + '" data-toggle="' + p + '.lexReview" data-card="1">' + (w.lexReview ? "verify" : "mark verify") + "</button></div></div>" +
        '<div class="erow"><span><button type="button" class="ebtn" data-move="' + p + '" data-dir="-1">→ earlier</button> <button type="button" class="ebtn" data-move="' + p + '" data-dir="1">later ←</button></span>' +
        '<button type="button" class="ebtn x" data-del="' + p + '" data-closecard="1">Remove word</button></div>';
    } else if (w.lexSource) {
      h += '<div class="lex">Lexicon: ' + esc(w.lexSource) + (w.lexReview ? ' <span class="verify">verify</span>' : "") + "</div>";
    }
    return h;
  }
  const addBtnCard = (p, kind, label) => editing ? '<button type="button" class="ebtn" data-add="' + p + '" data-kind="' + kind + '" data-card="1">+ ' + label + "</button>" : "";

  function openCard(el, pin) {
    const vi = +el.dataset.v, wi = +el.dataset.w;
    clearTimeout(hideT);
    if (pinned && !pin && cardAt && (cardAt.vi !== vi || cardAt.wi !== wi)) return;
    if (pin) pinned = true;
    const same = cardAt && cardAt.vi === vi && cardAt.wi === wi && !card.hidden;
    cardAt = { vi, wi, el };
    if (!same) card.innerHTML = cardHtml(vi, wi);
    card.hidden = false;
    markOn();
    place(el);
  }
  function refreshCard() { if (cardAt && !card.hidden) { card.innerHTML = cardHtml(cardAt.vi, cardAt.wi); markOn(); } }
  function markOn() {
    document.querySelectorAll(".w.on").forEach((e) => e.classList.remove("on"));
    if (cardAt) document.querySelectorAll('.w[data-v="' + cardAt.vi + '"][data-w="' + cardAt.wi + '"]').forEach((e) => e.classList.add("on"));
  }
  function place(el) {
    if (matchMedia("(max-width: 640px)").matches) { card.style.left = ""; card.style.top = ""; return; }
    const r = el.getBoundingClientRect(), cw = card.offsetWidth, ch = card.offsetHeight, m = 12;
    let left = Math.min(Math.max(m, r.left + r.width / 2 - cw / 2), innerWidth - cw - m);
    let top = r.bottom + 8;
    if (top + ch > innerHeight - m) top = Math.max(m, r.top - ch - 8);
    card.style.left = left + "px"; card.style.top = top + "px";
  }
  function closeCard() { card.hidden = true; pinned = false; cardAt = null; markOn(); }
  const hover = matchMedia("(hover: hover)");
  document.addEventListener("mouseover", (e) => {
    if (!hover.matches) return;
    const w = e.target.closest(".w");
    if (w) openCard(w, false);
    else if (e.target.closest("#card")) clearTimeout(hideT);
  });
  document.addEventListener("mouseout", (e) => {
    if (!hover.matches || pinned) return;
    if (e.target.closest(".w") || e.target.closest("#card")) {
      clearTimeout(hideT);
      hideT = setTimeout(() => { if (!pinned) closeCard(); }, 220);
    }
  });
  document.addEventListener("click", (e) => {
    const w = e.target.closest(".w");
    if (w) { openCard(w, true); return; }
    if (!e.target.closest("#card") && !e.target.closest("#ebar") && !card.hidden) closeCard();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { closeCard(); document.getElementById("modal").hidden = true; }
    const w = e.target.closest && e.target.closest(".w");
    if (w && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openCard(w, true); }
  });
  addEventListener("scroll", () => { if (cardAt && !card.hidden && !pinned) closeCard(); else if (cardAt && !card.hidden && cardAt.el.isConnected) place(cardAt.el); }, { passive: true });
  addEventListener("resize", () => { if (cardAt && !card.hidden && cardAt.el.isConnected) place(cardAt.el); });

  /* ---------- Editing ---------- */
  document.addEventListener("input", (e) => {
    const el = e.target.closest("[data-path]");
    if (!el || !editing) return;
    const p = el.dataset.path;
    set(p, el.innerText.replace(/\n+$/, ""));
    // keep every copy of an Arabic word in sync while typing in the card
    const m = /^verses\.(\d+)\.words\.(\d+)\.ar$/.exec(p);
    if (m) document.querySelectorAll('#main .w[data-v="' + m[1] + '"][data-w="' + m[2] + '"]').forEach((w) => { w.textContent = get(p); });
    save(); renderChecks();
  });
  document.addEventListener("paste", (e) => {
    if (!e.target.closest || !e.target.closest("[contenteditable]")) return;
    e.preventDefault();
    document.execCommand("insertText", false, (e.clipboardData || window.clipboardData).getData("text/plain"));
  });
  document.addEventListener("keydown", (e) => {
    const el = e.target.closest && e.target.closest('[contenteditable="true"]');
    if (el && e.key === "Enter" && el.tagName !== "P" && el.tagName !== "DIV") e.preventDefault();
  });
  document.addEventListener("click", (e) => {
    const t = e.target.closest("button"); if (!t || !editing) return;
    const d = t.dataset; let changed = true, structural = true;
    if (d.add) get(d.add).push(NEW[d.kind]());
    else if (d.del) { const ks = d.del.split("."), i = +ks.pop(); get(ks.join(".")).splice(i, 1); if (d.closecard) closeCard(); }
    else if (d.cycle) { const c = get(d.cycle); c.tag = ORDER[(ORDER.indexOf(c.tag) + 1) % ORDER.length]; }
    else if (d.toggle) set(d.toggle, !get(d.toggle));
    else if (d.setclaim) set(d.setclaim, blank());
    else if (d.unset) set(d.unset, null);
    else if (d.move) {
      const ks = d.move.split("."), i = +ks.pop(), arr = get(ks.join(".")), j = i + (+d.dir);
      if (j < 0 || j >= arr.length) return;
      [arr[i], arr[j]] = [arr[j], arr[i]];
      if (cardAt) cardAt.wi = j;
    } else { changed = structural = false; }
    if (!changed) return;
    save();
    const inCard = !!t.closest("#card");
    const sy = scrollY;
    render();
    scrollTo(0, sy);
    if (inCard && cardAt) {
      const el = document.querySelector('#main .w[data-v="' + cardAt.vi + '"][data-w="' + cardAt.wi + '"]');
      if (el) { cardAt.el = el; refreshCard(); place(el); } else closeCard();
    }
  });

  /* ---------- Rules check ---------- */
  function allClaims() {
    const out = [], s = doc.surah;
    const add = (c, where, at) => { if (c) out.push({ c, where, at }); };
    s.theme.forEach((c) => add(c, "Surah · Central theme", "whole"));
    s.miracle.forEach((c) => add(c, "Surah · " + (c.title || "Miracle note"), "whole"));
    add(s.revelation, "Surah · Place of revelation", "whole");
    ["previous", "next"].forEach((k) => s.links[k].claims.forEach((c) => add(c, "Surah · Neighbouring surah", "whole")));
    add(s.ring.claim, "Surah · Ring structure", "whole");
    doc.verses.forEach((v) => {
      const V = "Verse " + v.n, at = "v" + v.n;
      v.words.forEach((w) => { add(w.why, V + " · " + (w.tr || "word") + " · why", at); add(w.special, V + " · " + (w.tr || "word") + " · beyond the dictionary", at); });
      v.layers.forEach((l, i) => { add(l.explanation, V + " · Layer " + (i + 1), at); l.tafsir.forEach((c) => add(c, V + " · Layer " + (i + 1) + " · Tafsir", at)); });
      v.miracle.forEach((c) => add(c, V + " · " + (c.title || "Miracle note"), at));
      if (v.asbab.exists) ["narration", "grading"].forEach((k) => add(v.asbab[k], V + " · Reason for revelation (" + k + ")", at));
      if (v.asbab.exists && v.asbab.disagreement && v.asbab.disagreement.text) add(v.asbab.disagreement, V + " · Reason for revelation (disagreement)", at);
    });
    return out;
  }
  const empty = (s) => !s || !String(s).trim();
  function checks() {
    const issues = []; let review = 0;
    const claims = allClaims();
    claims.forEach(({ c, where, at }) => {
      if (empty(c.text)) { issues.push({ where, at, msg: "Empty claim." }); return; }
      if (!c.tag) issues.push({ where, at, msg: "No tag." });
      if (c.tag === "scholar" && empty(c.scholar)) issues.push({ where, at, msg: "Scholar's view without a scholar's name." });
      if (c.review) review++;
      BANNED.forEach((b) => { if (b.re.test(c.text)) issues.push({ where, at, msg: b.msg, warn: true }); });
    });
    doc.verses.forEach((v) => {
      const V = "Verse " + v.n, at = "v" + v.n;
      if (empty(v.literal)) issues.push({ where: V, at, msg: "Literal translation is missing." });
      if (!v.layers.length) issues.push({ where: V, at, msg: "No layers of meaning.", warn: true });
      v.words.forEach((w) => {
        if (w.lexReview) review++;
        const W = V + " · " + (w.tr || "word");
        if (empty(w.ar)) issues.push({ where: W, at, msg: "Arabic word is empty." });
        if (!w.meanings.length) issues.push({ where: W, at, msg: "No classical meanings." });
        if (!w.translations.some((t) => t.used)) issues.push({ where: W, at, msg: "No translation marked as meant here.", warn: true });
      });
    });
    return { issues, review, total: claims.length };
  }
  function renderChecks() {
    const r = checks(), bad = r.issues.length;
    const b = document.getElementById("btn-check");
    b.innerHTML = (bad ? '<span class="count-bad">' + bad + " to fix</span>" : '<span class="count-ok">All ' + r.total + " claims tagged</span>") + " · " + r.review + " to verify";
    document.getElementById("issues").innerHTML = r.issues.length
      ? r.issues.map((i) => '<a href="#' + i.at + '"' + (i.warn ? ' class="warn"' : "") + "><span>" + esc(i.where) + "</span>" + esc(i.msg) + "</a>").join("")
      : '<a href="#whole" class="warn"><span>Project rules</span>Nothing to fix. Items marked verify still need scholar review.</a>';
  }

  /* ---------- Toolbar ---------- */
  function setEditing(on) {
    editing = on;
    document.getElementById("edit-toggle").setAttribute("aria-pressed", on);
    document.getElementById("edit-toggle").textContent = on ? "Editing" : "Edit";
    document.getElementById("ebar").hidden = !on;
    const sy = scrollY; closeCard(); render(); scrollTo(0, sy);
    if (on) status(hadSaved() ? "Editing · your edits are saved in this browser" : "Editing · changes save in this browser");
  }
  function hadSaved() { try { return !!localStorage.getItem(KEY); } catch (e) { return false; } }
  document.getElementById("edit-toggle").addEventListener("click", () => setEditing(!editing));
  document.getElementById("btn-done").addEventListener("click", () => setEditing(false));
  document.getElementById("btn-check").addEventListener("click", (e) => {
    const box = document.getElementById("issues"); box.hidden = !box.hidden; e.currentTarget.setAttribute("aria-expanded", !box.hidden);
  });
  document.getElementById("issues").addEventListener("click", (e) => { if (e.target.closest("a")) document.getElementById("issues").hidden = true; });
  document.getElementById("btn-copy").addEventListener("click", () => {
    const text = JSON.stringify(doc, null, 2);
    const fallback = () => { openModal(text); document.getElementById("import-err").textContent = "Copying is blocked here. The JSON is selected; copy it with your keyboard."; document.getElementById("import-text").select(); };
    try { navigator.clipboard.writeText(text).then(() => status("Copied the surah as JSON"), fallback); } catch (err) { fallback(); }
  });
  function openModal(text) { document.getElementById("modal").hidden = false; document.getElementById("import-text").value = text || ""; document.getElementById("import-err").textContent = ""; document.getElementById("import-text").focus(); }
  document.getElementById("btn-import").addEventListener("click", () => openModal(""));
  document.getElementById("import-cancel").addEventListener("click", () => { document.getElementById("modal").hidden = true; });
  document.getElementById("import-go").addEventListener("click", () => {
    try {
      const d = JSON.parse(document.getElementById("import-text").value);
      if (!d || !d.surah || !Array.isArray(d.verses)) throw new Error("shape");
      doc = d; document.getElementById("modal").hidden = true; save(); render(); status("Imported and saved in this browser");
    } catch (err) {
      document.getElementById("import-err").textContent = err.message === "shape" ? "This JSON is not a surah file. It needs \"surah\" and \"verses\"." : "This is not valid JSON. Check that you pasted the whole file.";
    }
  });
  const reset = document.getElementById("btn-reset"); let resetT = null;
  reset.addEventListener("click", () => {
    if (!reset.classList.contains("armed")) {
      reset.classList.add("armed"); reset.textContent = "Click again to restore";
      resetT = setTimeout(() => { reset.classList.remove("armed"); reset.textContent = "Restore original"; }, 4000);
      return;
    }
    clearTimeout(resetT); reset.classList.remove("armed"); reset.textContent = "Restore original";
    doc = clone(SEED); try { localStorage.removeItem(KEY); } catch (e) { /* ignore */ }
    closeCard(); render(); status("Restored the original");
  });

  /* ---------- Night sky ---------- */
  const sky = document.getElementById("sky"), ctx = sky.getContext("2d");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let stars = [];
  function seedSky() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    sky.width = innerWidth * dpr; sky.height = innerHeight * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round(innerWidth * innerHeight / 7000);
    stars = Array.from({ length: n }, () => ({
      x: Math.random() * innerWidth, y: Math.random() * innerHeight,
      r: Math.random() < .92 ? Math.random() * .8 + .25 : Math.random() * .7 + 1,
      a: Math.random() * .55 + .15, gold: Math.random() < .08,
      tw: Math.random() < .3 ? Math.random() * 2 + .5 : 0, ph: Math.random() * 6.28
    }));
  }
  function drawSky(t) {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const s of stars) {
      const a = s.tw && !still ? s.a * (.55 + .45 * Math.sin(t / 1000 * s.tw + s.ph)) : s.a;
      ctx.globalAlpha = a;
      ctx.fillStyle = s.gold ? "#E8B84A" : "#F4F2FA";
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  let last = 0;
  function loop(t) { if (t - last > 80) { drawSky(t); last = t; } requestAnimationFrame(loop); }
  seedSky(); drawSky(0);
  if (!still) requestAnimationFrame(loop);
  addEventListener("resize", () => { seedSky(); drawSky(performance.now()); });

  render();
})();
</script>
