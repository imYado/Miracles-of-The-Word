<title>/*__TITLE__*/</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Red+Hat+Text:wght@400;500&family=Spectral:ital,wght@0,300;0,400;1,300&display=swap">
<style>
/* Layout: one quiet column under a night sky. The surah in Arabic first, then each verse opening into its layers. Single dark theme by design. */
:root {
  --night: #0D0A18;
  --raised: #151027;
  --line: #2A2342;
  --purple: #7B66B8;
  --purple-soft: #1D1733;
  --text: #F4F2FA;
  --muted: #A69EBE;
  --dim: #6E6788;
  --gold: #E8B84A;
  --gold-faint: rgba(232, 184, 74, .12);
  --t-consensus: #8FD5B5;
  --t-scholar: #B9AAF6;
  --t-reflection: #E8B84A;
  --verify: #F19A8C;
  --f-ar: "Amiri Quran", "Amiri", "Scheherazade New", "Traditional Arabic", serif;
  --f-display: "Cormorant Garamond", "Cormorant", Garamond, Georgia, serif;
  --f-body: "Spectral", Georgia, "Times New Roman", serif;
  --f-ui: "Red Hat Text", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--night); }
body { background: var(--night); color: var(--text); font-family: var(--f-body); font-weight: 300; font-size: 17px; line-height: 1.65; }
#sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
.page { position: relative; z-index: 1; max-width: 860px; margin: 0 auto;
  padding-block: 20px 140px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
:focus-visible { outline: 1px solid var(--gold); outline-offset: 3px; border-radius: 3px; }
::selection { background: var(--gold-faint); }

/* Header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 8px; }
.brand { font-family: var(--f-ui); font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); text-decoration: none; display: inline-flex; gap: 10px; align-items: center; }
.brand .star { color: var(--gold); font-size: 13px; letter-spacing: 0; }
.edit-toggle { font-family: var(--f-ui); font-size: 13px; letter-spacing: .08em; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 5px 14px; }
.edit-toggle:hover { color: var(--gold); border-color: var(--gold); }
.edit-toggle[aria-pressed="true"] { color: var(--night); background: var(--gold); border-color: var(--gold); }

/* Hero */
.hero { text-align: center; padding-block: 56px 28px; display: grid; gap: 8px; justify-items: center; }
.hero .name-ar { font-family: var(--f-ar); font-size: clamp(56px, 13vw, 92px); line-height: 1.3; color: var(--gold); margin: 0; font-weight: 400; }
.hero h1 { margin: 0; font-family: var(--f-display); font-weight: 500; font-size: clamp(28px, 5vw, 38px); letter-spacing: .02em; text-wrap: balance; }
.hero .meta { font-family: var(--f-ui); font-size: 12.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--dim); }
.hero .tagline { font-family: var(--f-display); font-style: italic; font-size: 22px; color: var(--muted); margin: 6px 0 0; max-width: 34ch; text-wrap: balance; }

/* Recitation */
.recite { padding-block: 28px 12px; display: grid; gap: 14px; }
.mushaf { font-family: var(--f-ar); direction: rtl; text-align: center; font-size: clamp(30px, 6.4vw, 46px); line-height: 2.25; margin: 0; }
.hint { text-align: center; font-family: var(--f-ui); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); margin: 0; }
.w { cursor: pointer; border-radius: 6px; padding: 0 .06em; transition: color .15s; display: inline-block; min-width: .6em; line-height: 1.6; }
.w:hover, .w:focus-visible, .w.on { color: var(--gold); outline: none; }
.w:empty::before { content: "…"; color: var(--dim); }
.end { color: var(--gold); font-size: .62em; padding-inline: .25em; opacity: .85; white-space: nowrap; }

/* Divider */
.divider { display: flex; align-items: center; gap: 16px; color: var(--gold); font-size: 12px; margin-block: 56px 40px; }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }

/* Verse */
.verse { display: grid; gap: 34px; scroll-margin-top: 20px; }
.v-label { font-family: var(--f-ui); font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); text-align: center; }
.ayah { font-family: var(--f-ar); direction: rtl; text-align: center; font-size: clamp(34px, 7vw, 52px); line-height: 2; margin: -18px 0 0; }
.literal { text-align: center; display: grid; gap: 4px; }
.literal p { font-family: var(--f-display); font-size: 23px; margin: 0; color: var(--text); font-weight: 500; }
.literal .added { color: var(--dim); }
.label { font-family: var(--f-ui); font-size: 11.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--dim); }
.block { display: grid; gap: 20px; }
.block > h3 { margin: 0; font-family: var(--f-ui); font-weight: 500; font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 12px; }
.block > h3::after { content: ""; flex: 1; height: 1px; background: var(--line); }

.layer { display: grid; grid-template-columns: 2.2em minmax(0, 1fr); gap: 4px 14px; }
.layer + .layer { padding-top: 22px; border-top: 1px solid var(--line); }
.layer .n { font-family: var(--f-display); font-size: 26px; color: var(--gold); line-height: 1.1; font-variant-numeric: lining-nums; }
.layer .body { display: grid; gap: 12px; min-width: 0; }
.layer .reading { font-family: var(--f-ui); font-size: 12.5px; letter-spacing: .06em; color: var(--muted); }
.layer .tl { font-family: var(--f-display); font-size: clamp(24px, 4.2vw, 30px); line-height: 1.25; margin: 0; font-weight: 500; text-wrap: balance; }
.tafsir { display: grid; gap: 14px; padding-left: 14px; border-left: 1px solid var(--purple); }
.tafsir .label { color: var(--purple); }
.tq { display: grid; gap: 3px; }
.tq .who { font-family: var(--f-ui); font-size: 13px; letter-spacing: .04em; color: var(--t-scholar); }
.tq .who.consensus { color: var(--t-consensus); }
.tq .who.reflection { color: var(--t-reflection); }
.tq p { margin: 0; font-size: 16.5px; }

.notes { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 28px 32px; }
.note { display: grid; gap: 6px; align-content: start; min-width: 0; }
.note .topic { font-family: var(--f-ui); font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--dim); }
.note h4 { margin: 0; font-family: var(--f-display); font-weight: 600; font-size: 24px; color: var(--gold); line-height: 1.2; }
.note p { margin: 0; font-size: 16.5px; }

.claim { display: grid; gap: 4px; min-width: 0; }
.claim > p { margin: 0; }
.by { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; font-family: var(--f-ui); font-size: 12.5px; color: var(--dim); }
.tag { letter-spacing: .03em; }
.tag::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: currentColor; margin-right: 6px; vertical-align: 1px; }
.tag.consensus { color: var(--t-consensus); }
.tag.scholar { color: var(--t-scholar); }
.tag.reflection { color: var(--t-reflection); }
.tag.none { color: var(--verify); }
.verify { margin-left: 6px; color: var(--verify); border: 1px solid currentColor; border-radius: 99px; padding: 0 7px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; line-height: 1.6; }
.verify.off { color: var(--dim); opacity: .7; }

details.asbab { border-top: 1px solid var(--line); padding-top: 14px; }
details.asbab summary { cursor: pointer; font-family: var(--f-ui); font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); list-style: none; display: flex; gap: 10px; align-items: center; }
details.asbab summary::-webkit-details-marker { display: none; }
details.asbab summary::before { content: "+"; color: var(--gold); font-size: 16px; letter-spacing: 0; width: 1em; }
details.asbab[open] summary::before { content: "−"; }
.asbab-body { display: grid; gap: 18px; padding-top: 16px; }
.asbab-body .label { display: block; margin-bottom: 2px; }
.quiet { color: var(--dim); font-style: italic; margin: 0; }

/* Surah as a whole */
.whole { display: grid; gap: 40px; }
.whole h2 { margin: 0; text-align: center; font-family: var(--f-display); font-weight: 500; font-size: 30px; }
.pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 28px; }
.pair h4 { margin: 0 0 8px; font-family: var(--f-display); font-size: 21px; font-weight: 600; }
.stack { display: grid; gap: 16px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 20px; justify-content: center; font-family: var(--f-ui); font-size: 12.5px; color: var(--dim); padding-top: 24px; border-top: 1px solid var(--line); }

/* Word card */
#card { position: fixed; z-index: 30; width: min(380px, calc(100vw - 24px)); max-height: min(72vh, 620px); overflow: auto; background: var(--raised); border: 1px solid var(--line); border-radius: 14px; padding: 18px 18px 16px; display: grid; gap: 14px; box-shadow: 0 18px 50px rgba(0, 0, 0, .55); }
#card .c-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
#card .c-ar { font-family: var(--f-ar); font-size: 44px; line-height: 1.5; color: var(--gold); direction: rtl; }
#card .c-tr { font-family: var(--f-display); font-style: italic; font-size: 22px; }
#card .c-root { font-family: var(--f-ui); font-size: 13px; color: var(--muted); }
#card .c-root .r-ar { font-family: var(--f-ar); font-size: 19px; color: var(--text); unicode-bidi: isolate; direction: rtl; }
#card .close { font-family: var(--f-ui); color: var(--dim); font-size: 20px; line-height: 1; padding: 2px 4px; }
#card .close:hover { color: var(--gold); }
#card .sect { display: grid; gap: 6px; }
#card .sect > .label { font-size: 10.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-family: var(--f-ui); font-size: 13.5px; border: 1px solid var(--line); color: var(--muted); border-radius: 99px; padding: 2px 10px; display: inline-flex; gap: 6px; align-items: center; }
.chip.used { border-color: var(--gold); color: var(--gold); }
.chip.used::before { content: "✦"; font-size: 9px; }
.chip button { color: inherit; opacity: .7; padding: 0; font-size: 12px; }
#card ul { margin: 0; padding-left: 18px; font-size: 15.5px; }
#card .claim > p { font-size: 15.5px; }
#card .special { border-left: 1px solid var(--gold); padding-left: 12px; }
#card .lex { font-family: var(--f-ui); font-size: 12px; color: var(--dim); }
#card .efields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; }
#card .efields .f { display: grid; gap: 2px; min-width: 0; }
#card .erow { display: flex; flex-wrap: wrap; gap: 6px; justify-content: space-between; }
@media (max-width: 640px) {
  #card { left: 0 !important; right: 0; bottom: 0; top: auto !important; width: 100%; max-height: 78vh; border-radius: 16px 16px 0 0; border-bottom: 0;
    padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
}

/* Edit mode */
[contenteditable="true"] { outline: none; border-bottom: 1px dashed rgba(232, 184, 74, .45); cursor: text; min-width: 1.5em; display: inline-block; }
p[contenteditable="true"], div[contenteditable="true"] { display: block; }
[contenteditable="true"]:focus { border-bottom-color: var(--gold); background: var(--gold-faint); }
[contenteditable="true"]:empty::before { content: attr(data-ph); color: var(--dim); font-style: italic; }
.ebtn { font-family: var(--f-ui); font-size: 12px; letter-spacing: .06em; color: var(--gold); border: 1px dashed rgba(232, 184, 74, .5); border-radius: 99px; padding: 2px 11px; justify-self: start; }
.ebtn:hover { background: var(--gold-faint); }
.ebtn.x { color: var(--verify); border-color: rgba(241, 154, 140, .5); }
.ebtn.x:hover { background: rgba(241, 154, 140, .1); }
.ebar-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tag-btn { font: inherit; padding: 0; }
.tag-btn:hover { text-decoration: underline; }

#ebar { position: fixed; z-index: 25; left: 0; right: 0; bottom: 0; background: var(--raised); border-top: 1px solid var(--line);
  padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px)); padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
#ebar .in { max-width: 860px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-family: var(--f-ui); font-size: 13px; }
#ebar .status { color: var(--dim); flex: 1 1 160px; min-width: 0; }
#ebar .btn { border: 1px solid var(--line); border-radius: 99px; padding: 4px 12px; color: var(--muted); }
#ebar .btn:hover { border-color: var(--gold); color: var(--gold); }
#ebar .btn.armed { border-color: var(--verify); color: var(--verify); }
#ebar .count-bad { color: var(--verify); }
#ebar .count-ok { color: var(--t-consensus); }
#issues { max-width: 860px; margin: 0 auto 10px; max-height: 36vh; overflow: auto; display: grid; gap: 6px; font-family: var(--f-ui); font-size: 13px; }
#issues a { display: block; color: var(--text); text-decoration: none; padding: 6px 10px; border-left: 2px solid var(--verify); background: var(--night); border-radius: 0 6px 6px 0; }
#issues a.warn { border-left-color: var(--gold); }
#issues a span { color: var(--dim); display: block; font-size: 11.5px; letter-spacing: .04em; }

#modal { position: fixed; inset: 0; z-index: 40; background: rgba(8, 6, 15, .8); display: grid; place-items: center; padding: 18px; }
#modal .box { width: min(640px, 100%); background: var(--raised); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 12px; font-family: var(--f-ui); font-size: 14px; }
#modal textarea { width: 100%; min-height: 220px; background: var(--night); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font: 12.5px/1.45 ui-monospace, Menlo, monospace; }
#modal .err { color: var(--verify); }

@media (max-width: 640px) {
  body { font-size: 16.5px; }
  .hero { padding-block: 36px 16px; }
  .layer { grid-template-columns: 1.6em minmax(0, 1fr); gap: 4px 10px; }
  .divider { margin-block: 44px 30px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<canvas id="sky" aria-hidden="true"></canvas>
<div class="page">
  <header class="top">
    <a class="brand" href="index.html"><span class="star">✦</span>The Miracles of The Word</a>
    <button class="edit-toggle" id="edit-toggle" type="button" aria-pressed="false">Edit</button>
  </header>
  <main id="main"></main>
</div>
<div id="card" role="dialog" aria-label="Word details" hidden></div>

  <div id="issues" hidden></div>
  <div class="in">
    <span class="status" id="status">Editing</span>
    <button class="btn" id="btn-check" type="button" aria-expanded="false"></button>
    <button class="btn" id="btn-copy" type="button">Copy JSON</button>
    <button class="btn" id="btn-import" type="button">Import</button>
    <button class="btn" id="btn-reset" type="button">Restore original</button>
    <button class="btn" id="btn-done" type="button">Done</button>
  </div>
</div>

  <div class="box">
    <strong>Import JSON</strong>

    <textarea id="import-text" aria-label="JSON to import"></textarea>
    <span class="err" id="import-err"></span>
    <div class="ebar-row"><button class="ebtn" id="import-go" type="button">Load</button><button class="ebtn x" id="import-cancel" type="button">Cancel</button></div>
  </div>
</div>

<script type="application/json" id="seed">/*__SEED__*/</script>
<script>
(function () {
  "use strict";
  const SEED = JSON.parse(document.getElementById("seed").textContent);
  const KEY = "motw-surah-" + SEED.surah.number;
  const TAGS = { consensus: "Consensus", scholar: "Scholar's view", reflection: "Reflection" };
  const ORDER = ["consensus", "scholar", "reflection"];
  const BANNED = [
    { re: /qir[aā]['ʾ’]?[aā]t|qira'a|variant reading/i, msg: "Mentions qiraʾāt. Project rule: no different qiraʾāt." },
    { re: /scien(ce|tific)|modern discover/i, msg: "Possible scientific miracle claim. Project rule: none." }
  ];
  const AR = (n) => String(n).replace(/\d/g, (d) => "٠١٢٣٤٥٦٧٨٩"[d]);
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const blank = () => ({ text: "", tag: "", scholar: "", source: "", review: false });
  const NEW = {
    claim: blank,
    note: () => Object.assign({ topic: "Word choice", title: "" }, blank()),
    layer: () => ({ reading: "", translation: "", explanation: blank(), tafsir: [] }),
    word: () => ({ ar: "", tr: "", root: "", rootTr: "", rootMeaning: "", meanings: [], translations: [], why: blank(), special: null, lexSource: "", lexReview: false }),
    translation: () => ({ text: "", used: false }),
    text: () => ""
  };

  let doc = load();
  let editing = false;

  function load() {
    try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && d.surah && Array.isArray(d.verses)) return d; } catch (e) { /* no saved copy */ }
    return clone(SEED);
  }
  let saveT = null;
  function save() {
    status("Saving…");
    clearTimeout(saveT);
    saveT = setTimeout(() => {
      try { localStorage.setItem(KEY, JSON.stringify(doc)); status("Saved in this browser"); }
      catch (e) { status("Not saved: this browser blocks storage. Use Copy JSON."); }
    }, 300);
  }
  function status(t) { document.getElementById("status").textContent = t; }

  const get = (p) => p.split(".").reduce((o, k) => (o == null ? o : o[k]), doc);
  function set(p, v) { const ks = p.split("."), last = ks.pop(); ks.reduce((o, k) => o[k], doc)[last] = v; }

  /* ---------- Building blocks ---------- */
  // Editable text. In read mode it is plain text; in edit mode the same element becomes editable in place.
  function ed(p, tag, cls, ph, ar) {
    tag = tag || "span";
    const v = get(p);
    const a = (cls ? ' class="' + cls + '"' : "") + (ar ? ' dir="rtl" lang="ar"' : "");
    if (!editing) return "<" + tag + a + ">" + esc(v) + "</" + tag + ">";
    return "<" + tag + a + ' contenteditable="true" spellcheck="' + (ar ? "false" : "true") + '" data-path="' + p + '" data-ph="' + esc(ph || "Write here") + '">' + esc(v) + "</" + tag + ">";
  }
  const btn = (attrs, label, x) => editing ? '<button type="button" class="ebtn' + (x ? " x" : "") + '" ' + attrs + ">" + label + "</button>" : "";
  const addBtn = (p, kind, label) => btn('data-add="' + p + '" data-kind="' + kind + '"', "+ " + label);
  const delBtn = (p, label) => btn('data-del="' + p + '"', label || "Remove", true);

  function byline(p) {
    const c = get(p);
    let h = '<div class="by">';
    if (editing) {
      h += '<button type="button" class="tag-btn tag ' + (c.tag || "none") + '" data-cycle="' + p + '" title="Click to change the tag">' + (c.tag ? TAGS[c.tag] : "Choose tag") + "</button>";
      if (c.tag === "scholar") h += ed(p + ".scholar", "span", "", "Scholar's name");
      h += ed(p + ".source", "span", "", "Source");
      h += '<button type="button" class="verify' + (c.review ? "" : " off") + '" data-toggle="' + p + '.review">' + (c.review ? "verify" : "mark verify") + "</button>";
    } else {
      h += '<span class="tag ' + (c.tag || "none") + '">' + (c.tag === "scholar" ? esc(c.scholar || "Scholar's view") : c.tag ? TAGS[c.tag] : "No tag") + "</span>";
      if (c.source) h += "<span>" + esc(c.source) + "</span>";
      if (c.review) h += '<span class="verify">verify</span>';
    }
    return h + "</div>";
  }
  const claim = (p, ph) => '<div class="claim">' + ed(p + ".text", "p", "", ph || "Write the claim") + byline(p) + "</div>";

  function literalHtml(s) { return esc(s).replace(/\[([^\]]*)\]/g, '<span class="added">[$1]</span>'); }
  function wordsHtml(vi) {
    return doc.verses[vi].words.map((w, wi) => '<span class="w" role="button" tabindex="0" data-v="' + vi + '" data-w="' + wi + '">' + esc(w.ar) + "</span>").join(" ") +
      ' <span class="end">﴿' + AR(doc.verses[vi].n) + "﴾</span>";
  }

  /* ---------- Page ---------- */
  function render() {
    const s = doc.surah;
    let h = '<section class="hero">' +
      '<p class="name-ar" lang="ar">' + esc(s.nameAr) + "</p>" +
      "<h1>Sūrat " + esc(s.nameTr) + "</h1>" +
      '<div class="meta">' + esc(s.nameEn) + " · Surah " + s.number + " · " + doc.verses.length + " verses</div>" +
      ed("surah.tagline", "p", "tagline", "One line about the surah") + "</section>";

    h += '<section class="recite"><p class="mushaf" lang="ar">' + doc.verses.map((v, i) => wordsHtml(i)).join(" ") + "</p>" +

  function openCard(el, pin) {
    const vi = +el.dataset.v, wi = +el.dataset.w;

    if (pin) pinned = true;
    const same = cardAt && cardAt.vi === vi && cardAt.wi === wi && !card.hidden;
    cardAt = { vi, wi, el };

  function refreshCard() { if (cardAt && !card.hidden) { card.innerHTML = cardHtml(cardAt.vi, cardAt.wi); markOn(); } }
  function markOn() {

    const r = el.getBoundingClientRect(), cw = card.offsetWidth, ch = card.offsetHeight, m = 12;
    let left = Math.min(Math.max(m, r.left + r.width / 2 - cw / 2), innerWidth - cw - m);
    let top = r.bottom + 8;

  }
  function closeCard() { card.hidden = true; pinned = false; cardAt = null; markOn(); }

  document.addEventListener("click", (e) => {

    else if (d.del) { const ks = d.del.split("."), i = +ks.pop(); get(ks.join(".")).splice(i, 1); if (d.closecard) closeCard(); }
    else if (d.cycle) { const c = get(d.cycle); c.tag = ORDER[(ORDER.indexOf(c.tag) + 1) % ORDER.length]; }
    else if (d.toggle) set(d.toggle, !get(d.toggle));
    else if (d.setclaim) set(d.setclaim, blank());
    else if (d.unset) set(d.unset, null);

  /* ---------- Rules check ---------- */
  function allClaims() {
    const out = [], s = doc.surah;
    const add = (c, where, at) => { if (c) out.push({ c, where, at }); };
    s.theme.forEach((c) => add(c, "Surah · Central theme", "whole"));
    s.miracle.forEach((c) => add(c, "Surah · " + (c.title || "Miracle note"), "whole"));
    add(s.revelation, "Surah · Place of revelation", "whole");
    ["previous", "next"].forEach((k) => s.links[k].claims.forEach((c) => add(c, "Surah · Neighbouring surah", "whole")));
    add(s.ring.claim, "Surah · Ring structure", "whole");
    doc.verses.forEach((v) => {
      const V = "Verse " + v.n, at = "v" + v.n;
      v.words.forEach((w) => { add(w.why, V + " · " + (w.tr || "word") + " · why", at); add(w.special, V + " · " + (w.tr || "word") + " · beyond the dictionary", at); });
      v.layers.forEach((l, i) => { add(l.explanation, V + " · Layer " + (i + 1), at); l.tafsir.forEach((c) => add(c, V + " · Layer " + (i + 1) + " · Tafsir", at)); });
      v.miracle.forEach((c) => add(c, V + " · " + (c.title || "Miracle note"), at));
      if (v.asbab.exists) ["narration", "grading"].forEach((k) => add(v.asbab[k], V + " · Reason for revelation (" + k + ")", at));
      if (v.asbab.exists && v.asbab.disagreement && v.asbab.disagreement.text) add(v.asbab.disagreement, V + " · Reason for revelation (disagreement)", at);
    });
    return out;
  }
  const empty = (s) => !s || !String(s).trim();
  function checks() {
    const issues = []; let review = 0;
    const claims = allClaims();
    claims.forEach(({ c, where, at }) => {
      if (empty(c.text)) { issues.push({ where, at, msg: "Empty claim." }); return; }
      if (!c.tag) issues.push({ where, at, msg: "No tag." });
      if (c.tag === "scholar" && empty(c.scholar)) issues.push({ where, at, msg: "Scholar's view without a scholar's name." });
      if (c.review) review++;
      BANNED.forEach((b) => { if (b.re.test(c.text)) issues.push({ where, at, msg: b.msg, warn: true }); });
    });
    doc.verses.forEach((v) => {
      const V = "Verse " + v.n, at = "v" + v.n;
      if (empty(v.literal)) issues.push({ where: V, at, msg: "Literal translation is missing." });
      if (!v.layers.length) issues.push({ where: V, at, msg: "No layers of meaning.", warn: true });
      v.words.forEach((w) => {
        if (w.lexReview) review++;
        const W = V + " · " + (w.tr || "word");
        if (empty(w.ar)) issues.push({ where: W, at, msg: "Arabic word is empty." });
        if (!w.meanings.length) issues.push({ where: W, at, msg: "No classical meanings." });
        if (!w.translations.some((t) => t.used)) issues.push({ where: W, at, msg: "No translation marked as meant here.", warn: true });
      });
    });
    return { issues, review, total: claims.length };
  }
  function renderChecks() {
    const r = checks(), bad = r.issues.length;
    const b = document.getElementById("btn-check");
    b.innerHTML = (bad ? '<span class="count-bad">' + bad + " to fix</span>" : '<span class="count-ok">All ' + r.total + " claims tagged</span>") + " · " + r.review + " to verify";
    document.getElementById("issues").innerHTML = r.issues.length
      ? r.issues.map((i) => '<a href="#' + i.at + '"' + (i.warn ? ' class="warn"' : "") + "><span>" + esc(i.where) + "</span>" + esc(i.msg) + "</a>").join("")
      : '<a href="#whole" class="warn"><span>Project rules</span>Nothing to fix. Items marked verify still need scholar review.</a>';
  }

  /* ---------- Night sky ---------- */
  const sky = document.getElementById("sky"), ctx = sky.getContext("2d");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let stars = [];
  function seedSky() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    sky.width = innerWidth * dpr; sky.height = innerHeight * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round(innerWidth * innerHeight / 7000);
    stars = Array.from({ length: n }, () => ({
      x: Math.random() * innerWidth, y: Math.random() * innerHeight,
      r: Math.random() < .92 ? Math.random() * .8 + .25 : Math.random() * .7 + 1,
      a: Math.random() * .55 + .15, gold: Math.random() < .08,
      tw: Math.random() < .3 ? Math.random() * 2 + .5 : 0, ph: Math.random() * 6.28
    }));
  }
  function drawSky(t) {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const s of stars) {
      const a = s.tw && !still ? s.a * (.55 + .45 * Math.sin(t / 1000 * s.tw + s.ph)) : s.a;
      ctx.globalAlpha = a;
      ctx.fillStyle = s.gold ? "#E8B84A" : "#F4F2FA";
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();

    ctx.globalAlpha = 1;
  }
  let last = 0;
  function loop(t) { if (t - last > 80) { drawSky(t); last = t; } requestAnimationFrame(loop); }
  seedSky(); drawSky(0);
  if (!still) requestAnimationFrame(loop);
  addEventListener("resize", () => { seedSky(); drawSky(performance.now()); });

  render();
})();
</script>
