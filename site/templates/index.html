<title>The Miracles of The Word</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Scheherazade+New&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Red+Hat+Text:wght@400;500&display=swap">
<style>
/* Layout: the library. A short list of surah pages under the same night sky. */
:root { --night: #0D0A18; --line: #2A2342; --text: #F4F2FA; --muted: #A69EBE; --dim: #6E6788; --gold: #E8B84A; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { background: var(--night); color: var(--text); }
body { font-family: "Red Hat Text", system-ui, sans-serif; }
.page { max-width: 760px; margin: 0 auto; padding-block: 64px 80px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); display: grid; gap: 40px; }
header { text-align: center; display: grid; gap: 10px; }
.star { color: var(--gold); }
h1 { margin: 0; font-family: "Cormorant Garamond", Georgia, serif; font-weight: 500; font-size: clamp(34px, 7vw, 52px); text-wrap: balance; }
header p { margin: 0; color: var(--muted); font-family: "Cormorant Garamond", Georgia, serif; font-style: italic; font-size: 21px; }
ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
li a { display: grid; grid-template-columns: 3em minmax(0, 1fr) auto; align-items: center; gap: 16px; padding: 18px 4px; border-bottom: 1px solid var(--line); color: inherit; text-decoration: none; }
li a:hover .en, li a:focus-visible .en { color: var(--gold); }
.num { color: var(--dim); font-variant-numeric: tabular-nums; letter-spacing: .1em; }
.en { font-family: "Cormorant Garamond", Georgia, serif; font-size: 24px; }
.en small { display: block; font-family: "Red Hat Text", sans-serif; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); }
.ar { font-family: "Scheherazade New", "Amiri Quran", serif; font-size: 30px; color: var(--gold); }
.foot { text-align: center; color: var(--dim); font-size: 13px; letter-spacing: .06em; }
</style>
<div class="page">
  <header>
    <span class="star">✦</span>
    <h1>The Miracles of The Word</h1>
    <p>A verse-by-verse study of the Qurʾān's language, for English readers.</p>
  </header>
  <ul>/*__LIST__*/</ul>
  <p class="foot">More surahs will be added here.</p>
</div>
