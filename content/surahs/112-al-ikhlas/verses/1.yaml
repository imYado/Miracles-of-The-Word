# al-Ikhlāṣ 112:1
n: 1
literal: "Say: He [is] Allah, one."
words:
  - entry: qul
    ar: قُلْ
    tr: qul
    used:
      - Say
    why:
      text: Imperative form. The command is addressed to the Prophet ﷺ, and through him to everyone who recites it.
      tag: consensus
  - entry: huwa
    ar: هُوَ
    tr: huwa
    used:
      - He
      - The truth is / The matter is
    why:
      text: The pronoun can point back to the one asked about, or it can be the pronoun of the matter, which announces that a weighty statement follows.
      tag: scholar
      scholar: al-Zamakhsharī
      sources:
        - id: kashshaf
          loc: on 112:1
      review: true
  - entry: allah
    ar: ٱللَّهُ
    tr: Allāhu
    used:
      - Allah
    why:
      text: Scholars differ on whether the name is derived (from ilāh, "the one who is worshipped") or is a proper name with no derivation. Both views are old, and this study does not choose between them.
      tag: scholar
      scholar: al-Rāghib discusses the derivation; the disagreement is reported among grammarians
      sources:
        - id: mufradat
          loc: entry ʾ-l-h
      review: true
    special:
      text: A proper name used only for the one true God. Grammarians note that it takes no plural and no dual.
      tag: consensus
      review: true
  - entry: ahad
    ar: أَحَدٌ
    tr: aḥadun
    used:
      - One
      - Unique
    why:
      text: In an affirmative sentence, aḥad in this absolute sense is used only of God. Elsewhere it mostly comes after a negation, meaning "anyone".
      tag: scholar
      scholar: al-Rāghib al-Iṣfahānī
      sources:
        - id: mufradat
          loc: entry aḥad
      review: true
    special:
      text: 'When Bilāl ibn Rabāḥ was tortured in Makkah to make him give up Islam, he kept repeating one word: "Aḥad, aḥad."'
      tag: scholar
      scholar: Ibn Isḥāq's Sīra, as transmitted by Ibn Hishām
      sources:
        - id: sira
      review: true
layers:
  - reading: '"He" is the Lord they asked about'
    translation: "Say: He is Allah, the One."
    note: "The answer to their question: the Lord you ask about is Allah."
    explanation:
      text: People asked about the Prophet's Lord. The pronoun huwa points back to the One they asked about, and the answer names Him.
      tag: scholar
      scholar: al-Zamakhsharī
      sources:
        - id: kashshaf
          loc: on 112:1
      review: true
    tafsir:
      - text: "Say, O Muhammad, to those who asked you about your Lord: He is Allah, One."
        tag: scholar
        scholar: al-Ṭabarī
        sources:
          - id: tabari
            loc: on 112:1
        review: true
      - text: He is the One, the Unique, with no peer, no helper, no rival, no likeness and no equal.
        tag: scholar
        scholar: Ibn Kathīr
        sources:
          - id: ibnkathir
            loc: on 112:1
        review: true
  - reading: '"He" announces a great truth'
    translation: "Say: The truth is this: Allah is One."
    note: The pronoun works like a pause before a great truth.
    explanation:
      text: huwa can be ḍamīr al-shaʾn, the "pronoun of the matter". Arabic uses it to draw attention before a statement of great weight, like saying "Here is the truth:".
      tag: scholar
      scholar: al-Zamakhsharī
      sources:
        - id: kashshaf
          loc: on 112:1
      review: true
    tafsir:
      - text: 'Mentions this reading alongside the first: the pronoun stands for "the matter", and "Allāhu aḥad" is the matter it introduces.'
        tag: scholar
        scholar: al-Zamakhsharī
        sources:
          - id: kashshaf
            loc: on 112:1
        review: true
  - reading: aḥad as "indivisible"
    translation: "Say: He is Allah, One without parts."
    note: Not only one in number, but one with no parts.
    explanation:
      text: aḥad does more than count to one. It denies a second like Him, and it also denies that He is made of parts.
      tag: reflection
      review: true
    tafsir:
      - text: Explains aḥad, when used of God, as the one that admits no plurality in any respect.
        tag: scholar
        scholar: al-Rāghib al-Iṣfahānī
        sources:
          - id: mufradat
            loc: entry aḥad
        review: true
miracle:
  - topic: Word choice
    title: Aḥad, not wāḥid
    text: "Arabic has two words for one. wāḥid can begin a count (one, two, three), so it leaves room for a second. aḥad, used of God, closes that door: no second, and no division."
    tag: scholar
    scholar: al-Rāghib al-Iṣfahānī
    sources:
      - id: mufradat
        loc: entries aḥad and w-ḥ-d
    review: true
  - topic: Definite / indefinite
    title: Indefinite on purpose
    text: The verse says aḥadun, not al-aḥad. The indefinite suggests a oneness that belongs to no category. He is not "the one" of a known group.
    tag: reflection
  - topic: Rhetoric
    title: Why "Say" stays
    text: The command "qul" is kept in the recited words. The reciter repeats what they were told to say, which marks the surah as a message passed on, not something composed.
    tag: reflection
asbab:
  exists: true
  narration:
    text: "Ubayy ibn Kaʿb reported that the polytheists said to the Prophet ﷺ: \"Describe your Lord's lineage to us,\" and God revealed this surah."
    tag: scholar
    scholar: Recorded by al-Tirmidhī and Aḥmad
    sources:
      - id: tirmidhi
        loc: Book of Tafsīr, on 112
      - id: musnad
    review: true
  grading:
    text: al-Tirmidhī also gives the report without Ubayy (mursal, from Abū al-ʿĀliya) and says that version is more correct. The connected chain includes Abū Jaʿfar al-Rāzī, about whom the hadith critics differ. Later graders disagree on whether it is ḥasan or weak.
    tag: scholar
    scholar: al-Tirmidhī
    sources:
      - id: tirmidhi
        loc: on 112
    review: true
  disagreement:
    text: Other reports say the question came from Jews of Madinah, not from the Quraysh. al-Ṭabarī collects reports on both sides. This is where the Makkan or Madinan disagreement comes from.
    tag: scholar
    scholar: al-Ṭabarī
    sources:
      - id: tabari
        loc: on 112
    review: true
